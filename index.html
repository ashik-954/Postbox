<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #6818e8 0%,
            #8120e8 45%,
            #214de0 100%
        );

    color:#17204a;
    overflow-x:hidden;
}

/* Background decoration */
body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    z-index:-1;
}

body::before{
    width:240px;
    height:240px;
    right:-90px;
    top:180px;
}

body::after{
    width:190px;
    height:190px;
    left:-90px;
    bottom:-60px;
}

/* Main wrapper */
.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    padding:12px 14px 0;
}

/* ================= HEADER ================= */

.header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:4px 4px 12px;
}

/* Profile area */
.profile-area{
    width:40%;
    max-width:250px;
    text-align:center;
    flex-shrink:0;
}

.profile-frame{
    width:148px;
    height:148px;
    margin:0 auto 5px;

    border-radius:50%;
    padding:6px;

    background:
        linear-gradient(
            135deg,
            #00cfff,
            #8b5cf6,
            #f4b4ff
        );

    box-shadow:
        0 0 0 3px rgba(255,255,255,.9),
        0 8px 22px rgba(20,0,80,.25);
}

.profile-frame img{
    width:100%;
    height:100%;
    display:block;

    border-radius:50%;
    object-fit:cover;

    object-position:center 62%;

    background:#eee;
}

.profile-name{
    color:white;
    font-size:20px;
    font-weight:800;
    text-shadow:0 2px 4px rgba(0,0,0,.25);
    white-space:nowrap;
}

/* Header right */
.hero{
    flex:1;
    min-width:0;
    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

/* ================= TOP PROFILE IMAGE ================= */

/*
   আগের মেসেজ আইকনের জায়গায় 1000.png
   ছোট গোলাকার ছবি
*/
.message-icon{
    width:58px;
    height:58px;

    border-radius:50%;

    padding:4px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #00cfff,
            #7048f4,
            #ef4de8
        );

    border:3px solid white;

    margin-bottom:7px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.20);
}

.message-icon img{
    width:100%;
    height:100%;

    display:block;

    border-radius:50%;

    object-fit:cover;
    object-position:center;

    background:#eee;
}

/* Main heading */
.hero-title{
    color:#fff13b;

    font-size:clamp(25px,5vw,38px);
    line-height:1.18;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35);

    max-width:370px;
}

/* Exactly two lines */
.hero-title .line{
    display:block;
    white-space:nowrap;
}

.hero-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    margin-top:7px;
}

.hero-decoration i{
    display:block;
    width:52px;
    height:3px;
    background:#fff;
    border-radius:10px;
}

.hero-decoration b{
    color:#ff9dc9;
    font-size:24px;
}

.hero-subtitle{
    color:white;
    font-size:12px;
    margin-top:4px;
    opacity:.95;
}

/* ================= FORM ================= */

.form-card{
    width:100%;
    background:#fff;

    border-radius:27px;

    padding:22px 18px 18px;

    box-shadow:
        0 12px 30px rgba(20,0,80,.22);

    margin-top:4px;
}

/* Form row */
.form-row{
    display:grid;
    grid-template-columns:78px 1fr;
    gap:12px;
    align-items:start;

    margin-bottom:13px;
}

/* Icon box */
.field-icon{
    width:78px;
    height:78px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:39px;

    background:#f0e7ff;

    border:1px solid rgba(100,50,180,.10);
}

.field-icon.phone{
    background:#e8f5ff;
}

.field-icon.message{
    background:#f0e7ff;
}

.field-icon.file{
    background:#e4faf7;
}

/* Field */
.field{
    min-width:0;
}

.field-label{
    display:block;

    color:#17204a;

    font-size:19px;
    font-weight:900;

    margin-bottom:5px;
}

.required{
    color:#ef4164;
}

.optional{
    color:#999;
    font-size:15px;
    font-weight:500;
}

/* Inputs */
input[type="text"],
textarea{
    width:100%;

    border:2px solid #ddd0ea;

    background:#fcf9ff;

    border-radius:15px;

    outline:none;

    color:#333;

    font-family:inherit;

    font-size:18px;

    padding:13px 17px;

    transition:.2s;
}

input[type="text"]{
    height:55px;
}

input[type="text"]:focus,
textarea:focus{
    border-color:#7139e9;
    box-shadow:0 0 0 3px rgba(113,57,233,.10);
}

.phone-input{
    background:#edf8ff !important;
    border-color:#bdddf0 !important;
}

/* Message box */
textarea{
    height:150px;
    resize:none;
}

/* ================= FILE ================= */

.file-box{
    width:100%;

    border:3px dashed #64c4b8;

    background:#effbf9;

    border-radius:18px;

    padding:8px 11px 9px;
}

.file-title{
    color:#218b7d;

    font-size:18px;
    font-weight:900;

    margin-bottom:5px;
}

.file-input{
    width:100%;
    height:43px;

    background:white;

    border:1px solid #d9d9d9;

    border-radius:11px;

    padding:5px;

    font-size:14px;
}

.file-note{
    color:#6da69f;

    font-size:12px;

    margin-top:4px;
}

/* ================= BUTTON ================= */

.send-button{
    width:100%;

    height:62px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            90deg,
            #4a18ef,
            #8220e8,
            #ef00a7
        );

    color:white;

    font-family:inherit;

    font-size:23px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px rgba(100,0,220,.25);

    margin-top:2px;
}

.send-button:active{
    transform:scale(.99);
}

.send-arrow{
    font-size:31px;
    vertical-align:-2px;
    margin-right:7px;
}

/* ================= SECURITY ================= */

.security{
    margin-top:10px;

    border:1px solid #f0dfad;

    background:#fffbea;

    border-radius:13px;

    text-align:center;

    padding:9px 6px;

    color:#8d856d;

    font-size:12px;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:white;

    font-size:13px;

    padding:12px 5px 14px;

    text-shadow:0 1px 2px rgba(0,0,0,.25);
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .page{
        padding:7px 14px 0;
    }

    .header{
        gap:14px;
        padding-bottom:10px;
    }

    .profile-area{
        width:42%;
    }

    .profile-frame{
        width:128px;
        height:128px;
        padding:5px;
    }

    .profile-name{
        font-size:17px;
    }

    .hero{
        width:58%;
    }

    /* উপরের আপনার ছবি */
    .message-icon{
        width:52px;
        height:52px;
        padding:3px;
        border-width:3px;
        margin-bottom:5px;
    }

    .hero-title{
        font-size:25px;
        line-height:1.15;
        max-width:300px;
    }

    .hero-title .line{
        white-space:nowrap;
    }

    .hero-decoration{
        margin-top:5px;
    }

    .hero-decoration i{
        width:42px;
        height:2px;
    }

    .hero-decoration b{
        font-size:20px;
    }

    .hero-subtitle{
        font-size:10px;
    }

    .form-card{
        padding:18px 12px 14px;
        border-radius:25px;
        margin-top:2px;
    }

    .form-row{
        grid-template-columns:74px 1fr;
        gap:9px;
        margin-bottom:12px;
    }

    .field-icon{
        width:74px;
        height:74px;
        font-size:35px;
        border-radius:17px;
    }

    .field-label{
        font-size:17px;
        margin-bottom:4px;
    }

    .optional{
        font-size:13px;
    }

    input[type="text"]{
        height:51px;
        font-size:17px;
        padding:11px 14px;
    }

    textarea{
        height:145px;
        font-size:17px;
        padding:12px 14px;
    }

    .file-box{
        border-width:3px;
        border-radius:17px;
        padding:7px 9px 8px;
    }

    .file-title{
        font-size:16px;
        margin-bottom:4px;
    }

    .file-input{
        height:40px;
        font-size:13px;
    }

    .file-note{
        font-size:11px;
    }

    .send-button{
        height:58px;
        font-size:21px;
    }

    .security{
        font-size:11px;
        padding:8px 4px;
    }

    .footer{
        font-size:11px;
        padding-top:10px;
    }
}

/* Very small screens */
@media(max-width:380px){

    .header{
        gap:8px;
    }

    .profile-frame{
        width:115px;
        height:115px;
    }

    .profile-name{
        font-size:15px;
    }

    .message-icon{
        width:47px;
        height:47px;
        padding:3px;
    }

    .hero-title{
        font-size:21px;
    }

    .hero-subtitle{
        font-size:9px;
    }

    .form-row{
        grid-template-columns:65px 1fr;
    }

    .field-icon{
        width:65px;
        height:65px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ================= HEADER ================= -->

    <header class="header">

        <!-- LEFT PROFILE -->
        <div class="profile-area">

            <div class="profile-frame">
                <img
                    src="1000.png"
                    alt="আশিকুর রহমান"
                >
            </div>

            <div class="profile-name">
                আশিকুর রহমান
            </div>

        </div>


        <!-- RIGHT HERO -->
        <div class="hero">

            <!-- আপনার ছবির ছোট সংস্করণ -->
            <div class="message-icon">
                <img
                    src="1000.png"
                    alt="আশিকুর রহমান"
                >
            </div>

            <div class="hero-title">
                <span class="line">আপনার কথা</span>
                <span class="line">আমার কাছে পৌঁছে দিন</span>
            </div>

            <div class="hero-decoration">
                <i></i>
                <b>♥</b>
                <i></i>
            </div>

            <div class="hero-subtitle">
                বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!
            </div>

        </div>

    </header>


    <!-- ================= FORM ================= -->

    <main class="form-card">

        <!-- NAME -->
        <div class="form-row">

            <div class="field-icon">
                👤
            </div>

            <div class="field">

                <label class="field-label">
                    আপনার নাম <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="name"
                    placeholder="আপনার নাম লিখুন"
                    autocomplete="name"
                >

            </div>

        </div>


        <!-- CONTACT -->
        <div class="form-row">

            <div class="field-icon phone">
                📞
            </div>

            <div class="field">

                <label class="field-label">
                    যোগাযোগ
                    <span class="optional">(ঐচ্ছিক)</span>
                </label>

                <input
                    type="text"
                    name="contact"
                    class="phone-input"
                    placeholder="নাম্বার, ই-মেইল অথবা লিংক"
                >

            </div>

        </div>


        <!-- MESSAGE -->
        <div class="form-row">

            <div class="field-icon message">
                💬
            </div>

            <div class="field">

                <label class="field-label">
                    আপনার মেসেজ <span class="required">*</span>
                </label>

                <textarea
                    name="message"
                    placeholder="আপনার কথা এখানে লিখুন..."
                ></textarea>

            </div>

        </div>


        <!-- FILE -->
        <div class="form-row">

            <div class="field-icon file">
                📎
            </div>

            <div class="field">

                <label class="field-label">
                    ফাইল সংযুক্ত করুন
                    <span class="optional">(ঐচ্ছিক)</span>
                </label>

                <div class="file-box">

                    <div class="file-title">
                        📎 ছবি, PDF বা অন্যান্য ফাইল
                    </div>

                    <input
                        type="file"
                        class="file-input"
                        name="file"
                        accept="image/*,.pdf"
                    >

                    <div class="file-note">
                        সর্বোচ্চ ২০ MB · একবারে ১টি ফাইল
                    </div>

                </div>

            </div>

        </div>


        <!-- SEND BUTTON -->
        <button
            type="button"
            class="send-button"
            onclick="sendMessage()"
        >
            <span class="send-arrow">➤</span>
            মেসেজ পাঠান
        </button>


        <!-- SECURITY -->
        <div class="security">
            🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️
    </footer>

</div>


<script>
function sendMessage(){

    const name =
        document.querySelector('[name="name"]').value.trim();

    const message =
        document.querySelector('[name="message"]').value.trim();

    if(!name){
        alert("দয়া করে আপনার নাম লিখুন।");
        return;
    }

    if(!message){
        alert("দয়া করে আপনার মেসেজ লিখুন।");
        return;
    }

    /*
      এখানে পরবর্তীতে আপনার
      Google Apps Script যুক্ত করা যাবে।
    */

    alert("মেসেজ প্রস্তুত হয়েছে।");

}
</script>

</body>
</html>
