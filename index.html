<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আপনার কথা, আমার কাছে পৌঁছে দিন</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        "Noto Sans Bengali",
        "SolaimanLipi",
        "Siyam Rupali",
        Arial,
        sans-serif;
    background:
        radial-gradient(circle at 10% 15%,rgba(255,255,255,.15),transparent 20%),
        radial-gradient(circle at 90% 80%,rgba(255,255,255,.12),transparent 25%),
        linear-gradient(135deg,#7125df 0%,#4d27d9 45%,#164ed5 100%);
    color:#151047;
    min-height:100vh;
    overflow-x:hidden;
}

/* Decorative background */
body::before{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:-130px;
    right:-100px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:280px;
    height:280px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    bottom:-140px;
    left:-100px;
    pointer-events:none;
}

.page{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:28px 18px 40px;
}

/* ================= HEADER ================= */

.hero{
    position:relative;
    min-height:430px;
    display:grid;
    grid-template-columns:38% 62%;
    align-items:center;
    gap:20px;
    padding:25px 20px 30px;
    overflow:hidden;
}

.hero::before{
    content:"";
    position:absolute;
    width:500px;
    height:240px;
    right:-120px;
    top:-80px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    transform:rotate(-15deg);
}

.hero::after{
    content:"";
    position:absolute;
    width:600px;
    height:200px;
    right:-200px;
    bottom:-100px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
}

/* Profile */

.profile-area{
    position:relative;
    z-index:2;
    text-align:center;
}

.profile-ring{
    position:relative;
    width:330px;
    height:330px;
    max-width:90vw;
    max-height:90vw;
    margin:auto;
    padding:8px;
    border-radius:50%;
    background:
        linear-gradient(135deg,#ffb8e9,#ffffff 35%,#7b5cff 70%,#ff6ccf);
    box-shadow:
        0 0 0 5px rgba(255,255,255,.45),
        0 15px 45px rgba(0,0,0,.25);
}

.profile-ring img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center 42%;
    border-radius:50%;
    border:7px solid white;
    background:#eee;
}

/* Verified badge */

.verify{
    position:absolute;
    right:4px;
    bottom:4px;
    width:70px;
    height:70px;
    border-radius:50%;
    background:#fff;
    border:4px solid #1976ff;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 6px 18px rgba(0,0,0,.22);
}

.verify span{
    width:49px;
    height:49px;
    border-radius:50%;
    background:#1976ff;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:31px;
    font-weight:900;
    line-height:1;
}

.profile-name{
    color:#fff;
    font-size:34px;
    font-weight:800;
    margin-top:16px;
    text-shadow:0 3px 10px rgba(0,0,0,.22);
}

.name-decoration{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:7px;
}

.name-decoration i{
    display:block;
    width:75px;
    height:2px;
    background:linear-gradient(to right,transparent,#ff8ee8);
}

.name-decoration span{
    color:#ff8ee8;
    font-size:20px;
}

/* Hero text */

.hero-text{
    position:relative;
    z-index:2;
    padding:10px 10px 10px 20px;
}

.chat-icon{
    width:70px;
    height:70px;
    border:2px solid rgba(255,255,255,.8);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    margin-bottom:16px;
    background:rgba(255,255,255,.08);
}

.hero-title{
    font-size:53px;
    line-height:1.18;
    font-weight:900;
    color:white;
    text-shadow:0 4px 10px rgba(0,0,0,.18);
}

.hero-title .gold{
    color:#ffd84a;
}

.hero-line{
    width:300px;
    height:2px;
    margin:25px 0 20px;
    background:linear-gradient(to right,#fff,transparent);
}

.hero-subtitle{
    color:#fff;
    font-size:23px;
    line-height:1.7;
}

/* ================= FORM CARD ================= */

.form-card{
    position:relative;
    z-index:5;
    background:rgba(255,255,255,.97);
    border-radius:30px;
    padding:38px 42px;
    box-shadow:
        0 20px 55px rgba(20,10,80,.25),
        0 3px 10px rgba(0,0,0,.08);
}

/* Fields */

.field-row{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:25px;
    align-items:start;
    margin-bottom:25px;
}

.icon-box{
    width:92px;
    height:92px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    background:linear-gradient(145deg,#f2e5ff,#e8d5ff);
    border:1px solid #dcc7ff;
}

.icon-box.blue{
    background:linear-gradient(145deg,#e9f5ff,#dbeeff);
    border-color:#b7d8ff;
}

.icon-box.green{
    background:linear-gradient(145deg,#e5fbf6,#d5f6ee);
    border-color:#b5e8dd;
}

.field-content label{
    display:block;
    font-size:22px;
    font-weight:800;
    color:#171050;
    margin-bottom:10px;
}

.required{
    color:#e91e3b;
}

.optional{
    color:#777;
    font-size:17px;
    font-weight:500;
}

input,
textarea{
    width:100%;
    border:1.5px solid #d5b8ed;
    border-radius:15px;
    outline:none;
    background:#fcf5ff;
    color:#28204f;
    font-family:inherit;
    font-size:20px;
    padding:17px 20px;
    transition:.2s;
}

input{
    height:62px;
}

textarea{
    min-height:180px;
    resize:vertical;
}

input:focus,
textarea:focus{
    border-color:#6932e8;
    box-shadow:0 0 0 4px rgba(105,50,232,.10);
}

.contact-input{
    background:#eef8ff;
    border-color:#a9d2f5;
}

/* File */

.file-area{
    border:2px dashed #50b9a9;
    background:#effcf9;
    border-radius:17px;
    padding:18px;
}

.file-title{
    color:#197d6d;
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

.file-input{
    background:#fff;
    border:1px solid #d8d8d8;
    padding:10px;
    height:auto;
    font-size:16px;
}

.file-note{
    color:#468c81;
    font-size:14px;
    margin-top:8px;
}

/* Button */

.submit-btn{
    width:100%;
    border:none;
    border-radius:17px;
    height:72px;
    cursor:pointer;
    color:white;
    font-family:inherit;
    font-size:27px;
    font-weight:900;
    background:linear-gradient(90deg,#4218ef,#7621ec,#ed0c9b);
    box-shadow:
        0 10px 25px rgba(100,25,220,.30);
    transition:.2s;
}

.submit-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 30px rgba(100,25,220,.38);
}

.submit-btn:active{
    transform:translateY(1px);
}

.submit-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.send-icon{
    margin-right:12px;
}

/* Privacy */

.privacy{
    margin-top:22px;
    padding:18px;
    border-radius:15px;
    border:1px solid #f2dfab;
    background:#fff9e9;
    color:#755a25;
    text-align:center;
    font-size:17px;
}

/* Footer */

.footer{
    color:white;
    text-align:center;
    padding:28px 10px 5px;
    font-size:17px;
    opacity:.95;
}

/* Message */

.status{
    display:none;
    margin-top:18px;
    padding:14px;
    border-radius:12px;
    text-align:center;
    font-weight:700;
}

.status.success{
    display:block;
    background:#e9fff5;
    color:#087852;
}

.status.error{
    display:block;
    background:#fff0f1;
    color:#b51f2e;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

    .page{
        padding:0 14px 30px;
    }

    .hero{
        grid-template-columns:1fr;
        min-height:auto;
        padding:30px 5px 45px;
        gap:25px;
        text-align:center;
    }

    .profile-ring{
        width:245px;
        height:245px;
    }

    .verify{
        width:59px;
        height:59px;
        right:1px;
        bottom:1px;
        border-width:3px;
    }

    .verify span{
        width:42px;
        height:42px;
        font-size:26px;
    }

    .profile-name{
        font-size:27px;
    }

    .hero-text{
        padding:0 5px;
    }

    .chat-icon{
        margin:0 auto 14px;
        width:62px;
        height:62px;
        font-size:32px;
    }

    .hero-title{
        font-size:37px;
    }

    .hero-line{
        width:220px;
        margin:20px auto 15px;
    }

    .hero-subtitle{
        font-size:17px;
    }

    .form-card{
        padding:28px 16px;
        border-radius:25px;
    }

    .field-row{
        grid-template-columns:58px 1fr;
        gap:12px;
        margin-bottom:22px;
    }

    .icon-box{
        width:58px;
        height:58px;
        border-radius:14px;
        font-size:28px;
    }

    .field-content label{
        font-size:17px;
        margin-bottom:8px;
    }

    .optional{
        font-size:13px;
    }

    input{
        height:51px;
    }

    input,
    textarea{
        font-size:16px;
        padding:13px 14px;
        border-radius:12px;
    }

    textarea{
        min-height:140px;
    }

    .file-area{
        padding:12px;
    }

    .file-title{
        font-size:15px;
    }

    .file-note{
        font-size:12px;
    }

    .submit-btn{
        height:60px;
        font-size:20px;
        border-radius:14px;
    }

    .privacy{
        font-size:13px;
        padding:14px 8px;
    }

    .footer{
        font-size:13px;
        padding-top:22px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="profile-area">

            <div class="profile-ring">

                <!-- IMPORTANT:
                     1000.png এবং index.html একই folder-এ রাখুন -->
                <img
                    src="./1000.png"
                    alt="আশিকুর রহমান"
                    onerror="this.style.display='none'; this.parentElement.classList.add('image-error');"
                >

                <div class="verify">
                    <span>✓</span>
                </div>

            </div>

            <div class="profile-name">
                আশিকুর রহমান
            </div>

            <div class="name-decoration">
                <i></i>
                <span>♥</span>
                <i></i>
            </div>

        </div>


        <div class="hero-text">

            <div class="chat-icon">
                💬
            </div>

            <h1 class="hero-title">
                আপনার কথা,<br>
                <span class="gold">
                    আমার কাছে পৌঁছে দিন।
                </span>
            </h1>

            <div class="hero-line"></div>

            <p class="hero-subtitle">
                বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই।
            </p>

        </div>

    </section>


    <!-- ================= FORM ================= -->

    <section class="form-card">

        <!--
        ==========================================================
        FORM ENDPOINT
        ==========================================================

        আপনার আগের backend endpoint থাকলে নিচের FORM_ENDPOINT
        variable-এ সেটি বসাতে হবে।

        উদাহরণ:
        const FORM_ENDPOINT = "https://example.com/submit";

        আমি ইচ্ছাকৃতভাবে কোনো ভুয়া endpoint দিইনি।
        ==========================================================
        -->

        <form id="messageForm">

            <!-- NAME -->

            <div class="field-row">

                <div class="icon-box">
                    👤
                </div>

                <div class="field-content">

                    <label>
                        আপনার নাম
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="আপনার নাম লিখুন"
                        required
                    >

                </div>

            </div>


            <!-- CONTACT -->

            <div class="field-row">

                <div class="icon-box blue">
                    📞
                </div>

                <div class="field-content">

                    <label>
                        যোগাযোগ
                        <span class="optional">(ঐচ্ছিক)</span>
                    </label>

                    <input
                        type="text"
                        name="contact"
                        class="contact-input"
                        placeholder="নাম্বার, ই-মেইল অথবা লিংক"
                    >

                </div>

            </div>


            <!-- MESSAGE -->

            <div class="field-row">

                <div class="icon-box">
                    💬
                </div>

                <div class="field-content">

                    <label>
                        আপনার মেসেজ
                        <span class="required">*</span>
                    </label>

                    <textarea
                        name="message"
                        placeholder="আপনার কথা এখানে লিখুন..."
                        required
                    ></textarea>

                </div>

            </div>


            <!-- FILE -->

            <div class="field-row">

                <div class="icon-box green">
                    📎
                </div>

                <div class="field-content">

                    <label>
                        ফাইল সংযুক্ত করুন
                        <span class="optional">(ঐচ্ছিক)</span>
                    </label>

                    <div class="file-area">

                        <div class="file-title">
                            📎 ছবি, PDF বা অন্য ফাইল
                        </div>

                        <input
                            type="file"
                            id="attachment"
                            name="attachment"
                            class="file-input"
                            accept="image/*,.pdf,.doc,.docx,.txt"
                        >

                        <div class="file-note">
                            সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল
                        </div>

                    </div>

                </div>

            </div>


            <!-- BUTTON -->

            <button
                type="submit"
                class="submit-btn"
                id="submitButton"
            >
                <span class="send-icon">➤</span>
                মেসেজ পাঠান
            </button>


            <!-- STATUS -->

            <div id="status" class="status"></div>


            <!-- PRIVACY -->

            <div class="privacy">
                🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপন রাখা হবে।
            </div>

        </form>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">
        🔒 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ 💜
    </footer>

</div>


<script>

/*
==========================================================
  MESSAGE FORM
==========================================================

  এখানে আপনার আসল backend URL বসাতে হবে।

  উদাহরণ:

  const FORM_ENDPOINT =
      "https://script.google.com/macros/s/XXXXXXXX/exec";

  যদি আপনার আগের Google Apps Script / Form endpoint থাকে,
  সেটিই এখানে ব্যবহার করবেন।

==========================================================
*/

const FORM_ENDPOINT = "";


const form = document.getElementById("messageForm");
const submitButton = document.getElementById("submitButton");
const statusBox = document.getElementById("status");
const attachment = document.getElementById("attachment");


/* File size check */

attachment.addEventListener("change", function(){

    if(!this.files.length){
        return;
    }

    const file = this.files[0];
    const maxSize = 20 * 1024 * 1024;

    if(file.size > maxSize){

        alert("ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।");

        this.value = "";
    }

});


/* Form submit */

form.addEventListener("submit", async function(event){

    event.preventDefault();

    statusBox.className = "status";
    statusBox.textContent = "";


    /*
      Backend URL না থাকলে পরিষ্কারভাবে জানাবে।
    */

    if(!FORM_ENDPOINT){

        statusBox.className = "status error";

        statusBox.textContent =
            "মেসেজ পাঠানোর জন্য আপনার আগের Form/Google Apps Script endpoint এখনো যুক্ত করা হয়নি।";

        return;
    }


    submitButton.disabled = true;

    submitButton.innerHTML =
        "⏳ মেসেজ পাঠানো হচ্ছে...";


    try{

        const formData = new FormData(form);


        const response = await fetch(
            FORM_ENDPOINT,
            {
                method:"POST",
                body:formData
            }
        );


        if(!response.ok){

            throw new Error("Server error");

        }


        form.reset();


        statusBox.className = "status success";

        statusBox.textContent =
            "✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।";


    }catch(error){

        statusBox.className = "status error";

        statusBox.textContent =
            "❌ মেসেজ পাঠানো যায়নি। কিছুক্ষণ পর আবার চেষ্টা করুন।";

    }


    submitButton.disabled = false;

    submitButton.innerHTML =
        '<span class="send-icon">➤</span> মেসেজ পাঠান';

});

</script>

</body>
</html>
