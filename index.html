<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আপনার কথা আমার কাছে পৌঁছে দিন</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #6320e8 0%,
            #8228e8 42%,
            #304fe8 100%
        );

    color:#17204d;
    overflow-x:hidden;
}

/* Background decoration */
body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    pointer-events:none;
}

body::before{
    width:230px;
    height:230px;
    right:-90px;
    top:130px;
}

body::after{
    width:180px;
    height:180px;
    left:-90px;
    bottom:-70px;
}

/* Main wrapper */
.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    padding:24px 14px 12px;
    position:relative;
    z-index:1;
}

/* Header */
.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:4px 8px 18px;
}

/* Profile section */
.profile{
    width:44%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.profile-photo-wrap{
    position:relative;
    width:150px;
    height:150px;
}

.profile-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:7px solid white;
    box-shadow:
        0 0 0 4px rgba(255,214,245,.8),
        0 7px 18px rgba(0,0,0,.22);
    display:block;
}

.check{
    position:absolute;
    right:-5px;
    bottom:-4px;

    width:48px;
    height:48px;

    border-radius:50%;
    background:#fff;

    border:4px solid #158eea;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#1489e8;
    font-size:29px;
    font-weight:900;

    box-shadow:0 3px 8px rgba(0,0,0,.18);
}

.profile-name{
    margin-top:12px;
    color:white;
    font-size:20px;
    font-weight:800;
    text-align:center;
    text-shadow:0 2px 3px rgba(0,0,0,.18);
}

/* Title section */
.hero-text{
    width:56%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    min-height:190px;
}

.message-icon{
    width:56px;
    height:56px;
    border-radius:50%;

    border:3px solid white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
    background:rgba(255,255,255,.06);
    margin-bottom:10px;

    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.hero-title{
    font-size:32px;
    line-height:1.15;
    font-weight:900;

    color:#d8ff3f;

    text-shadow:
        0 2px 2px rgba(0,0,0,.18);

    margin-bottom:13px;
}

.hero-line{
    width:190px;
    height:2px;
    background:rgba(255,255,255,.8);
    position:relative;
    margin-bottom:10px;
}

.hero-line::after{
    content:"♥";
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-52%);
    background:#8228e8;
    color:#ff9bbd;
    padding:0 9px;
    font-size:17px;
}

.hero-subtitle{
    color:white;
    font-size:13px;
    line-height:1.5;
    opacity:.95;
}

/* Form card */
.form-card{
    width:100%;
    background:#fff;
    border-radius:25px;
    padding:22px 20px 16px;

    box-shadow:
        0 15px 35px rgba(34,0,80,.22);

    margin-top:4px;
}

/* Form row */
.form-row{
    display:grid;
    grid-template-columns:64px 1fr;
    gap:14px;
    margin-bottom:15px;
    align-items:start;
}

.icon-box{
    width:64px;
    height:64px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    background:#efe5ff;
    border:1px solid rgba(102,42,220,.08);
}

.form-content{
    width:100%;
}

label{
    display:block;
    font-size:17px;
    font-weight:800;
    color:#1a2150;
    margin-bottom:6px;
}

.required{
    color:#ef315e;
}

.optional{
    color:#8c8c8c;
    font-size:13px;
    font-weight:400;
}

input[type="text"],
textarea{
    width:100%;

    border:1.8px solid #d8c9e7;
    border-radius:13px;

    background:#fcf8ff;

    padding:13px 15px;

    font-family:inherit;
    font-size:16px;

    color:#25264d;

    outline:none;

    transition:.2s;
}

input[type="text"]:focus,
textarea:focus{
    border-color:#7130e8;
    box-shadow:0 0 0 3px rgba(113,48,232,.10);
}

.contact-input{
    background:#eef8ff !important;
    border-color:#bdd9ed !important;
}

textarea{
    height:175px;
    min-height:175px;
    max-height:220px;
    resize:vertical;
    line-height:1.6;
}

/* File section */
.file-box{
    border:2px dashed #66c6b7;
    background:#effcf9;
    border-radius:15px;
    padding:12px;
}

.file-title{
    color:#238b7d;
    font-weight:800;
    font-size:16px;
    margin-bottom:8px;
}

input[type="file"]{
    width:100%;
    background:white;
    border:1px solid #d5d5d5;
    border-radius:9px;
    padding:8px;
    font-size:13px;
}

.file-note{
    margin-top:7px;
    color:#5c8d87;
    font-size:11px;
}

/* Send button */
.send-btn{
    width:100%;
    border:0;
    border-radius:14px;

    padding:14px 18px;

    background:
        linear-gradient(
            90deg,
            #4e22ec,
            #8d20e9,
            #e800a7
        );

    color:white;

    font-family:inherit;
    font-size:18px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 18px rgba(101,27,226,.25);

    margin-top:2px;

    transition:.2s;
}

.send-btn:active{
    transform:scale(.98);
}

.send-btn:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* Status */
.status{
    display:none;
    margin-top:12px;
    padding:10px 12px;
    border-radius:10px;
    text-align:center;
    font-size:14px;
    font-weight:700;
}

.status.success{
    display:block;
    background:#e7faee;
    color:#188548;
    border:1px solid #a7e4bf;
}

.status.error{
    display:block;
    background:#fff0f0;
    color:#c52c2c;
    border:1px solid #efb0b0;
}

/* Privacy note */
.privacy{
    margin-top:12px;

    background:#fff9e8;
    border:1px solid #f0dfaa;

    border-radius:11px;

    padding:9px;

    text-align:center;

    color:#77704e;
    font-size:11px;
}

/* Footer */
.footer{
    text-align:center;
    color:white;
    font-size:11px;
    padding:10px 0 2px;
    opacity:.95;
}

/* Mobile */
@media(max-width:600px){

    .page{
        padding:18px 10px 8px;
    }

    .header{
        gap:12px;
        padding-bottom:15px;
    }

    .profile{
        width:43%;
    }

    .hero-text{
        width:57%;
        min-height:165px;
    }

    .profile-photo-wrap{
        width:132px;
        height:132px;
    }

    .profile-photo{
        border-width:6px;
    }

    .check{
        width:42px;
        height:42px;
        font-size:25px;
        border-width:3px;
    }

    .profile-name{
        font-size:17px;
        margin-top:9px;
    }

    .message-icon{
        width:48px;
        height:48px;
        font-size:25px;
        margin-bottom:7px;
    }

    .hero-title{
        font-size:27px;
        line-height:1.13;
        margin-bottom:10px;
    }

    .hero-line{
        width:160px;
    }

    .hero-subtitle{
        font-size:11px;
    }

    .form-card{
        border-radius:20px;
        padding:18px 12px 13px;
    }

    .form-row{
        grid-template-columns:55px 1fr;
        gap:10px;
        margin-bottom:13px;
    }

    .icon-box{
        width:55px;
        height:55px;
        border-radius:14px;
        font-size:27px;
    }

    label{
        font-size:15px;
    }

    input[type="text"],
    textarea{
        font-size:15px;
        padding:11px 12px;
    }

    textarea{
        height:155px;
        min-height:155px;
    }

    .file-box{
        padding:10px;
    }

    .send-btn{
        font-size:17px;
        padding:13px;
    }
}

/* Very small phones */
@media(max-width:390px){

    .profile-photo-wrap{
        width:120px;
        height:120px;
    }

    .hero-title{
        font-size:24px;
    }

    .profile-name{
        font-size:15px;
    }

    .form-row{
        grid-template-columns:50px 1fr;
        gap:9px;
    }

    .icon-box{
        width:50px;
        height:50px;
    }
}
</style>
</head>

<body>

<div class="page">

    <!-- HEADER -->
    <header class="header">

        <!-- PROFILE -->
        <div class="profile">

            <div class="profile-photo-wrap">

                <!-- আপনার ছবির নাম অবশ্যই 1000.jpg হতে হবে -->
                <img
                    src="1000.jpg"
                    alt="আশিকুর রহমান"
                    class="profile-photo"
                    onerror="this.style.display='none';"
                >

                <div class="check">✓</div>

            </div>

            <div class="profile-name">
                আশিকুর রহমান
            </div>

        </div>


        <!-- TITLE -->
        <div class="hero-text">

            <div class="message-icon">
                💬
            </div>

            <h1 class="hero-title">
                আপনার কথা<br>
                আমার কাছে পৌঁছে দিন
            </h1>

            <div class="hero-line"></div>

            <p class="hero-subtitle">
                বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!
            </p>

        </div>

    </header>


    <!-- FORM -->
    <main class="form-card">

        <form id="messageForm">

            <!-- NAME -->
            <div class="form-row">

                <div class="icon-box">
                    👤
                </div>

                <div class="form-content">

                    <label>
                        আপনার নাম
                        <span class="required">*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="আপনার নাম লিখুন"
                        required
                    >

                </div>

            </div>


            <!-- CONTACT -->
            <div class="form-row">

                <div class="icon-box" style="background:#e8f5ff;">
                    📞
                </div>

                <div class="form-content">

                    <label>
                        যোগাযোগ
                        <span class="optional">(ঐচ্ছিক)</span>
                    </label>

                    <input
                        type="text"
                        id="contact"
                        name="contact"
                        class="contact-input"
                        placeholder="নাম্বার, ই-মেইল অথবা লিংক"
                    >

                </div>

            </div>


            <!-- MESSAGE -->
            <div class="form-row">

                <div class="icon-box">
                    💬
                </div>

                <div class="form-content">

                    <label>
                        আপনার মেসেজ
                        <span class="required">*</span>
                    </label>

                    <textarea
                        id="message"
                        name="message"
                        placeholder="আপনার কথা এখানে লিখুন..."
                        required
                    ></textarea>

                </div>

            </div>


            <!-- FILE -->
            <div class="form-row">

                <div
                    class="icon-box"
                    style="background:#e4faf6;"
                >
                    📎
                </div>

                <div class="form-content">

                    <label>
                        ফাইল সংযুক্ত করুন
                        <span class="optional">(ঐচ্ছিক)</span>
                    </label>

                    <div class="file-box">

                        <div class="file-title">
                            📎 ছবি, PDF বা অন্য ফাইল
                        </div>

                        <input
                            type="file"
                            id="file"
                            name="file"
                            accept="image/*,.pdf,.doc,.docx,.txt"
                        >

                        <div class="file-note">
                            সর্বোচ্চ ২০ MB · একবারে ১টি ফাইল
                        </div>

                    </div>

                </div>

            </div>


            <!-- SEND -->
            <button
                type="submit"
                class="send-btn"
                id="sendButton"
            >
                ➤ মেসেজ পাঠান
            </button>

            <!-- STATUS -->
            <div id="status" class="status"></div>

        </form>


        <!-- PRIVACY -->
        <div class="privacy">
            🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।
        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️
    </footer>

</div>


<script>

/* =====================================================
   GOOGLE APPS SCRIPT WEB APP URL
   ===================================================== */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbyRrsL9UJQ0IXWjavY7KpE0inoYun44cgyHpPgJlLR6Uduy9Ka2cfNpeMhf9D0Xc40LKg/exec";


/* =====================================================
   FORM SUBMIT
   ===================================================== */

const form =
document.getElementById("messageForm");

const button =
document.getElementById("sendButton");

const statusBox =
document.getElementById("status");


form.addEventListener("submit", async function(e){

    e.preventDefault();

    const name =
    document.getElementById("name").value.trim();

    const contact =
    document.getElementById("contact").value.trim();

    const message =
    document.getElementById("message").value.trim();

    const fileInput =
    document.getElementById("file");

    const file =
    fileInput.files[0];


    /* Validation */

    if(!name){

        showStatus(
            "আপনার নাম লিখুন।",
            "error"
        );

        return;
    }


    if(!message){

        showStatus(
            "আপনার মেসেজ লিখুন।",
            "error"
        );

        return;
    }


    /* File size check */

    if(file){

        const maxSize =
        20 * 1024 * 1024;

        if(file.size > maxSize){

            showStatus(
                "ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।",
                "error"
            );

            return;
        }
    }


    button.disabled = true;

    button.innerHTML =
    "⏳ মেসেজ পাঠানো হচ্ছে...";


    try{

        const formData =
        new FormData();

        formData.append(
            "name",
            name
        );

        formData.append(
            "contact",
            contact
        );

        formData.append(
            "message",
            message
        );


        if(file){

            formData.append(
                "file",
                file
            );

        }


        const response =
        await fetch(
            SCRIPT_URL,
            {
                method:"POST",
                body:formData
            }
        );


        const result =
        await response.text();


        let data;

        try{

            data =
            JSON.parse(result);

        }catch{

            data = {
                success:true
            };

        }


        if(
            data.success === true ||
            data.status === "success"
        ){

            showStatus(
                "✅ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।",
                "success"
            );

            form.reset();

        }else{

            showStatus(
                data.message ||
                "মেসেজ পাঠানো যায়নি।",
                "error"
            );

        }


    }catch(error){

        showStatus(
            "❌ মেসেজ পাঠাতে সমস্যা হয়েছে। আবার চেষ্টা করুন।",
            "error"
        );

        console.error(error);

    }


    button.disabled = false;

    button.innerHTML =
    "➤ মেসেজ পাঠান";

});


/* =====================================================
   STATUS MESSAGE
   ===================================================== */

function showStatus(text,type){

    statusBox.textContent =
    text;

    statusBox.className =
    "status " + type;

}

</script>

</body>
</html>
