<!doctype html>
<html lang="bn">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:20px;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc
    );

  color:#172033;
}

main{

  width:100%;
  max-width:520px;

  margin:30px auto;

  padding:28px;

  background:#ffffff;

  border-radius:24px;

  box-shadow:
    0 15px 40px rgba(15,23,42,.10);
}

h1{

  margin:0 0 10px;

  font-size:28px;

  text-align:center;
}

.intro{

  margin:0 0 25px;

  color:#667085;

  text-align:center;

  line-height:1.6;
}

label{

  display:block;

  margin-top:14px;
  margin-bottom:6px;

  font-weight:bold;

  font-size:14px;
}

input,
textarea,
button{

  width:100%;

  padding:14px;

  border-radius:13px;

  font-size:16px;
}

input,
textarea{

  border:
    1px solid #d0d5dd;

  background:#ffffff;

  outline:none;
}

input:focus,
textarea:focus{

  border-color:#4f46e5;

  box-shadow:
    0 0 0 3px
    rgba(79,70,229,.10);
}

textarea{

  min-height:150px;

  resize:vertical;
}

.file-box{

  padding:15px;

  border:
    1px dashed #a5b4fc;

  border-radius:14px;

  background:#f8faff;
}

.hint{

  margin-top:7px;

  font-size:13px;

  color:#667085;
}

button{

  margin-top:20px;

  border:0;

  background:#4f46e5;

  color:white;

  font-weight:bold;

  cursor:pointer;
}

button:disabled{

  opacity:.65;

  cursor:not-allowed;
}

#status{

  margin-top:18px;

  text-align:center;

  font-weight:bold;

  line-height:1.5;
}

.success{

  color:#087443;
}

.error{

  color:#b42318;
}

.cooldown{

  margin-top:14px;

  padding:13px;

  border-radius:13px;

  background:#fff7ed;

  color:#c2410c;

  text-align:center;

  font-weight:bold;
}

#countdown{

  font-size:24px;

  margin-top:4px;
}

</style>

</head>


<body>


<main>

<h1>
আমাকে একটি মেসেজ পাঠান
</h1>


<p class="intro">

আপনার কথা বা মতামত লিখে পাঠান।
চাইলে একটি ফাইলও সংযুক্ত করতে পারেন।

</p>


<form id="f">


<label for="n">
আপনার নাম
</label>

<input
  id="n"
  required
  maxlength="100"
  placeholder="নাম লিখুন"
>


<label for="p">
মোবাইল নম্বর (ঐচ্ছিক)
</label>

<input
  id="p"
  maxlength="30"
  placeholder="01XXXXXXXXX"
>


<label for="m">
মেসেজ
</label>

<textarea
  id="m"
  required
  maxlength="2000"
  placeholder="মেসেজ লিখুন..."
></textarea>


<label for="file">
ফাইল (ঐচ্ছিক)
</label>


<div class="file-box">

<input
  id="file"
  type="file"
>

<div class="hint">

সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল

</div>

</div>


<button
  id="b"
  type="submit"
>

মেসেজ পাঠান

</button>


<div id="status"></div>


<div
  id="cooldownBox"
  class="cooldown"
  style="display:none"
>

আবার মেসেজ পাঠাতে পারবেন

<div id="countdown">
30
</div>

সেকেন্ড পরে

</div>


</form>

</main>


<script>


/*
 * Apps Script API
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbyd0ldrrTOYJvptf3G4IZPdUq33z_Xb5PvCNzimy6zU7-jVNJpBO7IPuZ-Brrgp7GfBKQ/exec";


/*
 * Settings
 */

const MAX =
20 * 1024 * 1024;

const COOLDOWN =
30;


/*
 * Elements
 */

const f =
document.getElementById("f");

const b =
document.getElementById("b");

const s =
document.getElementById("status");

const fileInput =
document.getElementById("file");

const cooldownBox =
document.getElementById(
  "cooldownBox"
);

const countdown =
document.getElementById(
  "countdown"
);


/*
 * Permanent Client ID
 */

let clientId =
localStorage.getItem(
  "postbox_client_id"
);


if(!clientId){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
    "function"
  ){

    clientId =
      window.crypto.randomUUID();

  }else{

    clientId =
      "client-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2);

  }


  localStorage.setItem(
    "postbox_client_id",
    clientId
  );

}


/*
 * Countdown timer
 */

let timer = null;


function startCountdown(seconds){

  clearInterval(timer);

  let remaining =
    Math.max(
      0,
      Number(seconds)
    );


  b.disabled = true;


  cooldownBox.style.display =
    "block";


  countdown.textContent =
    remaining;


  timer =
    setInterval(

      function(){

        remaining--;


        countdown.textContent =
          Math.max(
            0,
            remaining
          );


        if(remaining <= 0){

          clearInterval(timer);


          cooldownBox.style.display =
            "none";


          b.disabled =
            false;

        }

      },

      1000

    );

}


/*
 * File size check
 */

fileInput.addEventListener(

  "change",

  function(){

    const x =
      fileInput.files[0];


    if(
      x &&
      x.size > MAX
    ){

      s.className =
        "error";


      s.textContent =
        "ফাইল ২০ MB-এর বেশি হতে পারবে না।";


      fileInput.value =
        "";

    }else{

      s.textContent =
        "";

    }

  }

);


/*
 * Submit
 */

f.onsubmit =
async function(e){

  e.preventDefault();


  const x =
    fileInput.files[0];


  /*
   * File size check
   */

  if(
    x &&
    x.size > MAX
  ){

    s.className =
      "error";


    s.textContent =
      "ফাইল ২০ MB-এর বেশি হতে পারবে না।";


    return;

  }


  /*
   * Disable button
   */

  b.disabled =
    true;


  b.textContent =
    "পাঠানো হচ্ছে...";


  s.className =
    "";

  s.textContent =
    "";


  try{

    let fd =
      null;


    /*
     * File → Base64
     */

    if(x){

      fd =
        await new Promise(

          function(resolve,reject){

            const reader =
              new FileReader();


            reader.onload =
              function(){

                resolve({

                  name:
                    x.name,

                  mimeType:
                    x.type ||
                    "application/octet-stream",

                  data:
                    reader.result
                      .split(",")[1]

                });

              };


            reader.onerror =
              reject;


            reader.readAsDataURL(x);

          }

        );

    }


    /*
     * Send request
     */

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },


          body:
            JSON.stringify({

              name:
                document
                  .getElementById("n")
                  .value
                  .trim(),

              phone:
                document
                  .getElementById("p")
                  .value
                  .trim(),

              message:
                document
                  .getElementById("m")
                  .value
                  .trim(),

              file:
                fd,

              /*
               * গুরুত্বপূর্ণ:
               * Client ID server-এ যাচ্ছে
               */

              clientId:
                clientId

            })

        }

      );


    const result =
      await response.json();


    /*
     * Server cooldown
     */

    if(
      result.cooldown === true
    ){

      s.className =
        "error";


      s.textContent =
        result.error ||
        "অনুগ্রহ করে অপেক্ষা করুন।";


      startCountdown(
        result.remaining ||
        COOLDOWN
      );


      return;

    }


    /*
     * Server error
     */

    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Unknown error"
      );

    }


    /*
     * Success
     */

    f.reset();


    s.className =
      "success";


    s.textContent =
      "✓ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।";


    /*
     * 30 second cooldown
     */

    startCountdown(
      COOLDOWN
    );


  }catch(error){

    s.className =
      "error";


    s.textContent =
      "মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।";


    b.disabled =
      false;

  }finally{

    if(
      cooldownBox.style.display !==
      "block"
    ){

      b.disabled =
        false;

    }


    b.textContent =
      "মেসেজ পাঠান";

  }

};

</script>

</body>

</html>
