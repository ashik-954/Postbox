<!doctype html>
<html lang="bn">

<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আপনার কথা, আমার কাছে পৌঁছে দিন</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:18px;

  font-family:
    Arial,
    "Noto Sans Bengali",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #eef2ff,
      #f8fafc 50%,
      #eef6ff
    );

  color:#172033;

  display:flex;
  align-items:center;
  justify-content:center;
}


/* Main Card */

main{
  width:100%;
  max-width:540px;

  padding:30px;

  background:#fff;

  border-radius:26px;

  box-shadow:
    0 20px 55px rgba(15,23,42,.12);
}


/* Header */

.header{
  text-align:center;
  margin-bottom:28px;
}


/* Logo */

.logo{
  width:68px;
  height:68px;

  margin:0 auto 16px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:20px;

  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #7c3aed
    );

  color:white;

  font-size:30px;

  box-shadow:
    0 10px 25px
    rgba(79,70,229,.25);
}


/* Main title */

h1{
  margin:0;

  font-size:28px;

  line-height:1.35;

  letter-spacing:-.3px;
}


/* Subtitle */

.subtitle{
  margin:11px 0 0;

  color:#667085;

  font-size:14px;

  line-height:1.7;
}


/* Fields */

.field{
  margin-top:18px;
}

label{
  display:block;

  margin-bottom:7px;

  font-size:14px;

  font-weight:700;

  color:#344054;
}


input,
textarea,
button{
  width:100%;

  font-family:inherit;

  font-size:16px;
}


input,
textarea{

  padding:14px 15px;

  border:
    1px solid #d0d5dd;

  border-radius:14px;

  outline:none;

  background:#fff;

  color:#101828;

  transition:.2s;
}


input:focus,
textarea:focus{

  border-color:#6366f1;

  box-shadow:
    0 0 0 4px
    rgba(99,102,241,.10);
}


textarea{

  min-height:155px;

  resize:vertical;

  line-height:1.6;
}


/* File box */

.file-box{

  padding:17px;

  border:
    1px dashed #a5b4fc;

  border-radius:16px;

  background:#f8faff;
}


.hint{

  margin-top:8px;

  font-size:12px;

  color:#667085;

  line-height:1.5;
}


.file-info{

  display:none;

  margin-top:10px;

  padding:10px 12px;

  border-radius:10px;

  background:#eef2ff;

  color:#3730a3;

  font-size:13px;

  line-height:1.5;
}


/* Button */

button{

  margin-top:23px;

  padding:15px;

  border:0;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #4f46e5,
      #7c3aed
    );

  color:#fff;

  font-weight:700;

  cursor:pointer;

  box-shadow:
    0 10px 22px
    rgba(79,70,229,.22);

  transition:.15s;
}


button:hover:not(:disabled){

  transform:translateY(-1px);

  box-shadow:
    0 13px 27px
    rgba(79,70,229,.28);
}


button:disabled{

  opacity:.65;

  cursor:not-allowed;

  box-shadow:none;
}


/* Status */

#status{

  margin-top:17px;

  text-align:center;

  font-size:14px;

  font-weight:700;

  line-height:1.6;
}


.success{
  color:#087443;
}


.error{
  color:#b42318;
}


/* Countdown */

.cooldown{

  display:none;

  margin-top:16px;

  padding:17px;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #fff7ed,
      #fffbeb
    );

  border:
    1px solid #fed7aa;

  color:#9a3412;

  text-align:center;

  font-weight:700;
}


#countdown{

  margin:5px 0;

  font-size:34px;

  line-height:1.2;

  font-weight:800;
}


/* Footer */

.footer{

  margin-top:22px;

  text-align:center;

  color:#98a2b3;

  font-size:12px;
}


/* Mobile */

@media(max-width:600px){

  body{
    padding:12px;
  }

  main{
    padding:23px 18px;

    border-radius:22px;
  }

  h1{
    font-size:24px;
  }

  .logo{
    width:58px;
    height:58px;

    font-size:26px;
  }

}

</style>

</head>


<body>


<main>


<div class="header">

  <div class="logo">
    ✉
  </div>


  <h1>
    💬 আপনার কথা, আমার কাছে পৌঁছে দিন
  </h1>


  <p class="subtitle">
    বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই।
  </p>

</div>


<form id="f">


<!-- Name -->

<div class="field">

<label for="n">
আপনার নাম
</label>

<input
  id="n"
  required
  maxlength="100"
  autocomplete="name"
  placeholder="আপনার নাম লিখুন"
>

</div>


<!-- Phone -->

<div class="field">

<label for="p">

মোবাইল নম্বর

<span style="font-weight:400;color:#98a2b3">
(ঐচ্ছিক)
</span>

</label>

<input
  id="p"
  maxlength="30"
  autocomplete="tel"
  inputmode="tel"
  placeholder="01XXXXXXXXX"
>

</div>


<!-- Message -->

<div class="field">

<label for="m">
আপনার মেসেজ
</label>

<textarea
  id="m"
  required
  maxlength="2000"
  placeholder="আপনার কথা এখানে লিখুন..."
></textarea>

</div>


<!-- File -->

<div class="field">

<label for="file">

ফাইল সংযুক্ত করুন

<span style="font-weight:400;color:#98a2b3">
(ঐচ্ছিক)
</span>

</label>


<div class="file-box">

<input
  id="file"
  type="file"
>

<div class="hint">
সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল
</div>


<div
  id="fileInfo"
  class="file-info"
></div>

</div>

</div>


<!-- Send -->

<button
  id="b"
  type="submit"
>
মেসেজ পাঠান
</button>


<div id="status"></div>


<!-- Countdown -->

<div
  id="cooldownBox"
  class="cooldown"
>

<div>
আবার মেসেজ পাঠাতে পারবেন
</div>

<div id="countdown">
30
</div>

<div>
সেকেন্ড পরে
</div>

</div>


</form>


<div class="footer">
আপনার বার্তাটি সঠিকভাবে সংরক্ষণ করা হবে।
</div>


</main>


<script>


/*
 * Apps Script API
 * বর্তমান কার্যকর URL
 */

const API_URL =
"https://script.google.com/macros/s/AKfycbyd0ldrrTOYJvptf3G4IZPdUq33z_Xb5PvCNzimy6zU7-jVNJpBO7IPuZ-Brrgp7GfBKQ/exec";


const MAX =
20 * 1024 * 1024;


const COOLDOWN =
30;


/*
 * Elements
 */

const f =
document.getElementById("f");

const b =
document.getElementById("b");

const s =
document.getElementById("status");

const fileInput =
document.getElementById("file");

const fileInfo =
document.getElementById("fileInfo");

const cooldownBox =
document.getElementById("cooldownBox");

const countdown =
document.getElementById("countdown");


/*
 * Permanent Client ID
 */

let clientId =
localStorage.getItem(
  "postbox_client_id"
);


if(!clientId){

  if(
    window.crypto &&
    typeof window.crypto.randomUUID ===
    "function"
  ){

    clientId =
      window.crypto.randomUUID();

  }else{

    clientId =
      "client-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2);

  }


  localStorage.setItem(
    "postbox_client_id",
    clientId
  );

}


/*
 * Countdown
 */

let timer = null;


function startCountdown(seconds){

  clearInterval(timer);

  let remaining =
    Math.max(
      0,
      Number(seconds)
    );


  b.disabled =
    true;


  cooldownBox.style.display =
    "block";


  countdown.textContent =
    remaining;


  timer =
    setInterval(

      function(){

        remaining--;

        countdown.textContent =
          Math.max(
            0,
            remaining
          );


        if(remaining <= 0){

          clearInterval(timer);

          cooldownBox.style.display =
            "none";

          b.disabled =
            false;

        }

      },

      1000

    );

}


/*
 * File information
 */

fileInput.addEventListener(

"change",

function(){

  const file =
    fileInput.files[0];


  if(!file){

    fileInfo.style.display =
      "none";

    return;

  }


  if(file.size > MAX){

    s.className =
      "error";

    s.textContent =
      "ফাইল ২০ MB-এর বেশি হতে পারবে না।";

    fileInput.value =
      "";

    fileInfo.style.display =
      "none";

    return;

  }


  const sizeMB =
    file.size /
    (1024 * 1024);


  fileInfo.textContent =
    "📎 " +
    file.name +
    " • " +
    sizeMB.toFixed(2) +
    " MB";


  fileInfo.style.display =
    "block";


  s.textContent =
    "";

});


/*
 * Submit
 */

f.onsubmit =
async function(e){

  e.preventDefault();


  const x =
    fileInput.files[0];


  if(
    x &&
    x.size > MAX
  ){

    s.className =
      "error";

    s.textContent =
      "ফাইল ২০ MB-এর বেশি হতে পারবে না।";

    return;

  }


  b.disabled =
    true;


  b.textContent =
    "পাঠানো হচ্ছে...";


  s.className =
    "";

  s.textContent =
    "";


  try{

    let fd =
      null;


    /*
     * File → Base64
     */

    if(x){

      fd =
        await new Promise(

          function(resolve,reject){

            const reader =
              new FileReader();


            reader.onload =
              function(){

                resolve({

                  name:
                    x.name,

                  mimeType:
                    x.type ||
                    "application/octet-stream",

                  data:
                    reader.result
                      .split(",")[1]

                });

              };


            reader.onerror =
              reject;


            reader.readAsDataURL(x);

          }

        );

    }


    /*
     * Send request
     */

    const response =
      await fetch(

        API_URL,

        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },


          body:
            JSON.stringify({

              name:
                document
                  .getElementById("n")
                  .value
                  .trim(),

              phone:
                document
                  .getElementById("p")
                  .value
                  .trim(),

              message:
                document
                  .getElementById("m")
                  .value
                  .trim(),

              file:
                fd,

              clientId:
                clientId

            })

        }

      );


    const result =
      await response.json();


    /*
     * Server cooldown
     */

    if(
      result.cooldown === true
    ){

      s.className =
        "error";


      s.textContent =
        result.error ||
        "অনুগ্রহ করে অপেক্ষা করুন।";


      startCountdown(
        result.remaining ||
        COOLDOWN
      );


      return;

    }


    /*
     * Server error
     */

    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Unknown error"
      );

    }


    /*
     * Success
     */

    f.reset();


    fileInfo.style.display =
      "none";


    fileInfo.textContent =
      "";


    s.className =
      "success";


    s.textContent =
      "✓ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।";


    startCountdown(
      COOLDOWN
    );


  }catch(error){

    s.className =
      "error";


    s.textContent =
      "মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।";


    b.disabled =
      false;

  }finally{

    if(
      cooldownBox.style.display !==
      "block"
    ){

      b.disabled =
        false;

    }


    b.textContent =
      "মেসেজ পাঠান";

  }

};

</script>


</body>

</html>
