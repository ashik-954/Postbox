<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>আমাকে একটি মেসেজ পাঠান</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f5ff;
  padding:20px
}

main{
  max-width:520px;
  margin:auto;
  background:white;
  padding:28px;
  border-radius:22px;
  box-shadow:0 10px 30px #0001
}

input,textarea,button{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  margin:8px 0 14px;
  border-radius:12px;
  border:1px solid #ccd2e0;
  font-size:16px
}

textarea{
  min-height:150px
}

button{
  background:#4f46e5;
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer
}

button:disabled{
  opacity:.65;
  cursor:not-allowed
}

.hint{
  font-size:13px;
  color:#667085
}

#status{
  text-align:center;
  font-weight:bold;
  min-height:24px
}
</style>
</head>

<body>

<main>

<h1>আমাকে একটি মেসেজ পাঠান</h1>

<p>
আপনার কথা বা মতামত লিখে পাঠান।
চাইলে একটি ফাইল সংযুক্ত করতে পারেন।
</p>

<form id="f">

<label>আপনার নাম</label>

<input
  id="n"
  required
  maxlength="100"
  placeholder="নাম লিখুন"
>


<label>মোবাইল নম্বর (ঐচ্ছিক)</label>

<input
  id="p"
  maxlength="30"
  placeholder="01XXXXXXXXX"
>


<label>মেসেজ</label>

<textarea
  id="m"
  required
  maxlength="2000"
  placeholder="মেসেজ লিখুন..."
></textarea>


<label>ফাইল (ঐচ্ছিক)</label>

<input
  id="file"
  type="file"
>

<div class="hint">
সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল
</div>


<button
  id="b"
  type="submit"
>
মেসেজ পাঠান
</button>

<div id="status"></div>

</form>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyd0ldrrTOYJvptf3G4IZPdUq33z_Xb5PvCNzimy6zU7-jVNJpBO7IPuZ-Brrgp7GfBKQ/exec";

const MAX_FILE_SIZE =
20 * 1024 * 1024;

const COOLDOWN_SECONDS = 30;

const form =
document.getElementById("f");

const button =
document.getElementById("b");

const status =
document.getElementById("status");

const fileInput =
document.getElementById("file");


/*
 * একই browser-এর জন্য
 * একটি স্থায়ী Client ID তৈরি
 */

function getClientId(){

  let id =
  localStorage.getItem("message_client_id");

  if(!id){

    if(window.crypto &&
       crypto.randomUUID){

      id = crypto.randomUUID();

    }else{

      id =
      "client-" +
      Date.now() +
      "-" +
      Math.random()
      .toString(36)
      .substring(2);

    }

    localStorage.setItem(
      "message_client_id",
      id
    );

  }

  return id;
}


/*
 * Local cooldown check
 */

function getLastSubmission(){

  return Number(
    localStorage.getItem(
      "message_last_submission"
    ) || 0
  );

}


/*
 * Countdown চালানো
 */

function startCooldown(seconds){

  let remaining =
  Math.max(
    0,
    Math.ceil(seconds)
  );

  button.disabled = true;

  function update(){

    if(remaining <= 0){

      button.disabled = false;

      button.textContent =
      "মেসেজ পাঠান";

      status.textContent = "";

      return;

    }

    button.textContent =
    "আবার পাঠাতে " +
    remaining +
    " সেকেন্ড";

    remaining--;

    setTimeout(
      update,
      1000
    );

  }

  update();

}


/*
 * Page refresh হলেও
 * cooldown বজায় থাকবে
 */

function checkExistingCooldown(){

  const last =
  getLastSubmission();

  if(!last) return;

  const elapsed =
  (Date.now() - last) / 1000;

  const remaining =
  COOLDOWN_SECONDS - elapsed;

  if(remaining > 0){

    startCooldown(
      remaining
    );

  }

}


checkExistingCooldown();


/*
 * Form Submit
 */

form.onsubmit =
async function(e){

  e.preventDefault();


  /*
   * Local cooldown
   */

  const last =
  getLastSubmission();

  const elapsed =
  (Date.now() - last) / 1000;

  if(
    last &&
    elapsed < COOLDOWN_SECONDS
  ){

    const remaining =
    Math.ceil(
      COOLDOWN_SECONDS - elapsed
    );

    startCooldown(
      remaining
    );

    status.textContent =
    "আবার মেসেজ পাঠানোর আগে " +
    remaining +
    " সেকেন্ড অপেক্ষা করুন।";

    return;

  }


  /*
   * File check
   */

  const file =
  fileInput.files[0];

  if(
    file &&
    file.size > MAX_FILE_SIZE
  ){

    status.textContent =
    "ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।";

    return;

  }


  /*
   * API URL check
   */

  if(
    API_URL.includes(
      "PASTE_YOUR"
    )
  ){

    status.textContent =
    "API URL সেট করা হয়নি।";

    return;

  }


  button.disabled = true;

  button.textContent =
  "পাঠানো হচ্ছে...";


  try{

    /*
     * File → Base64
     */

    let fileData = null;


    if(file){

      fileData =
      await new Promise(
        function(resolve,reject){

          const reader =
          new FileReader();

          reader.onload =
          function(){

            resolve({

              name:
              file.name,

              mimeType:
              file.type ||
              "application/octet-stream",

              data:
              reader.result
              .split(",")[1]

            });

          };

          reader.onerror =
          reject;

          reader.readAsDataURL(
            file
          );

        }
      );

    }


    /*
     * Client ID
     */

    const clientId =
    getClientId();


    /*
     * Server-এ পাঠানো
     */

    const response =
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:
        JSON.stringify({

          name:
          document
          .getElementById("n")
          .value
          .trim(),

          phone:
          document
          .getElementById("p")
          .value
          .trim(),

          message:
          document
          .getElementById("m")
          .value
          .trim(),

          clientId:
          clientId,

          file:
          fileData

        })

      }
    );


    const result =
    await response.json();


    /*
     * Server cooldown
     */

    if(
      result.cooldown
    ){

      status.textContent =
      result.error;

      startCooldown(
        result.remaining || 30
      );

      return;

    }


    /*
     * অন্য error
     */

    if(
      !result.success
    ){

      throw new Error(
        result.error ||
        "Submission failed"
      );

    }


    /*
     * সফল হলে সময় সংরক্ষণ
     */

    localStorage.setItem(
      "message_last_submission",
      String(Date.now())
    );


    /*
     * Form পরিষ্কার
     */

    form.reset();


    status.textContent =
    "✓ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।";


    /*
     * ৩০ সেকেন্ড cooldown
     */

    startCooldown(
      COOLDOWN_SECONDS
    );


  }catch(error){

    console.error(error);

    status.textContent =
    "মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।";

    button.disabled = false;

    button.textContent =
    "মেসেজ পাঠান";

  }

};

</script>

</body>
</html>
