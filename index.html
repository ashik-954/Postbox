<!DOCTYPE html>
<html lang="bn">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #6818e8 0%,
            #8120e8 45%,
            #214de0 100%
        );

    color:#17204a;
    overflow-x:hidden;
}


/* =========================
   BACKGROUND
========================= */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    z-index:-1;
}

body::before{
    width:240px;
    height:240px;
    right:-90px;
    top:180px;
}

body::after{
    width:190px;
    height:190px;
    left:-90px;
    bottom:-60px;
}


/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 14px 0;
}


/* =========================
   HEADER
========================= */

.header{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 4px 18px;
}

.hero{
    width:100%;
    text-align:center;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}


/* =========================
   MESSAGE ICON
========================= */

.message-icon{
    width:64px;
    height:64px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    border:4px solid white;

    margin-bottom:8px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);
}

.message-icon span{
    font-size:34px;
    line-height:1;
}


/* =========================
   TITLE
========================= */

.hero-title{
    color:#fff13b;

    font-size:clamp(25px,6vw,38px);

    line-height:1.18;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35);

    width:100%;

    max-width:500px;
}

.hero-title .line{
    display:block;
    white-space:nowrap;
}


/* =========================
   DECORATION
========================= */

.hero-decoration{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:9px;

    margin-top:8px;
}

.hero-decoration i{
    display:block;

    width:55px;
    height:3px;

    background:#fff;

    border-radius:10px;
}

.hero-decoration b{
    color:#ff9dc9;
    font-size:24px;
}

.hero-subtitle{
    color:white;

    font-size:12px;

    margin-top:5px;

    opacity:.95;
}


/* =========================
   FORM CARD
========================= */

.form-card{
    width:100%;

    background:#fff;

    border-radius:27px;

    padding:22px 18px 18px;

    box-shadow:
        0 12px 30px rgba(20,0,80,.22);

    margin-top:0;
}


/* =========================
   FORM ROW
========================= */

.form-row{
    display:grid;

    grid-template-columns:78px 1fr;

    gap:12px;

    align-items:start;

    margin-bottom:13px;
}


/* =========================
   FIELD ICON
========================= */

.field-icon{
    width:78px;
    height:78px;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:39px;

    background:#f0e7ff;

    border:
        1px solid
        rgba(100,50,180,.10);
}

.field-icon.phone{
    background:#e8f5ff;
}

.field-icon.message{
    background:#f0e7ff;
}

.field-icon.file{
    background:#e4faf7;
}


/* =========================
   FIELD
========================= */

.field{
    min-width:0;
}

.field-label{
    display:block;

    color:#17204a;

    font-size:19px;

    font-weight:900;

    margin-bottom:5px;
}

.required{
    color:#ef4164;
}

.optional{
    color:#999;

    font-size:15px;

    font-weight:500;
}


/* =========================
   INPUTS
========================= */

input[type="text"],
textarea{

    width:100%;

    border:
        2px solid
        #ddd0ea;

    background:#fcf9ff;

    border-radius:15px;

    outline:none;

    color:#333;

    font-family:inherit;

    font-size:18px;

    padding:13px 17px;

    transition:.2s;
}

input[type="text"]{
    height:55px;
}

input[type="text"]:focus,
textarea:focus{

    border-color:#7139e9;

    box-shadow:
        0 0 0 3px
        rgba(113,57,233,.10);
}

.phone-input{

    background:#edf8ff !important;

    border-color:#bdddf0 !important;
}


/* =========================
   MESSAGE
========================= */

textarea{

    height:155px;

    resize:none;
}


/* =========================
   FILE BOX
========================= */

.file-box{

    width:100%;

    border:
        3px dashed
        #64c4b8;

    background:#effbf9;

    border-radius:18px;

    padding:8px 11px 9px;
}

.file-title{

    color:#218b7d;

    font-size:17px;

    font-weight:900;

    margin-bottom:5px;
}

.file-input{

    width:100%;

    height:43px;

    background:white;

    border:
        1px solid
        #d9d9d9;

    border-radius:11px;

    padding:5px;

    font-size:14px;
}

.file-note{

    color:#6da69f;

    font-size:12px;

    margin-top:4px;
}


/* =========================
   SEND BUTTON
========================= */

.send-button{

    width:100%;

    height:62px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            90deg,
            #4a18ef,
            #8220e8,
            #ef00a7
        );

    color:white;

    font-family:inherit;

    font-size:23px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(100,0,220,.25);

    margin-top:2px;

    transition:.2s;
}

.send-button:active{
    transform:scale(.99);
}

.send-button:disabled{

    opacity:.75;

    cursor:not-allowed;
}

.send-arrow{

    font-size:31px;

    vertical-align:-2px;

    margin-right:7px;
}


/* =========================
   SECURITY
========================= */

.security{

    margin-top:10px;

    border:
        1px solid
        #f0dfad;

    background:#fffbea;

    border-radius:13px;

    text-align:center;

    padding:9px 6px;

    color:#8d856d;

    font-size:12px;
}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    color:white;

    font-size:13px;

    padding:12px 5px 14px;

    text-shadow:
        0 1px 2px
        rgba(0,0,0,.25);
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:12px 14px 0;
    }

    .header{
        padding-bottom:16px;
    }

    .message-icon{

        width:58px;
        height:58px;

        border-width:3px;

        margin-bottom:7px;
    }

    .message-icon span{
        font-size:30px;
    }

    .hero-title{

        font-size:25px;

        line-height:1.16;

        max-width:100%;
    }

    .hero-title .line{
        white-space:nowrap;
    }

    .hero-decoration{
        margin-top:6px;
    }

    .hero-decoration i{

        width:43px;
        height:2px;
    }

    .hero-decoration b{
        font-size:20
