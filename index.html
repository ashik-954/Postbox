<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #6818e8 0%,
            #8120e8 45%,
            #214de0 100%
        );

    color:#17204a;
    overflow-x:hidden;
}


/* ================= BACKGROUND ================= */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    z-index:-1;
}

body::before{
    width:240px;
    height:240px;
    right:-90px;
    top:180px;
}

body::after{
    width:190px;
    height:190px;
    left:-90px;
    bottom:-60px;
}


/* ================= PAGE ================= */

.page{
    width:100%;
    max-width:760px;
    margin:0 auto;

    min-height:100vh;

    padding:
        18px
        14px
        0;
}


/* ================= HEADER ================= */

.header{
    width:100%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:
        4px
        4px
        22px;
}


/* ================= HERO TITLE ================= */

.hero-title{
    color:#fff13b;

    font-size:
        clamp(
            27px,
            6vw,
            40px
        );

    line-height:1.18;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35);

    width:100%;

    max-width:600px;
}


/* দুই লাইনে রাখা */

.hero-title .line{
    display:block;
    white-space:nowrap;
}


/* ================= DECORATION ================= */

.hero-decoration{
    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    margin-top:8px;
}

.hero-decoration i{
    display:block;

    width:58px;
    height:3px;

    background:#fff;

    border-radius:10px;
}

.hero-decoration b{
    color:#ff9dc9;

    font-size:25px;
}


/* ================= SUBTITLE ================= */

.hero-subtitle{
    color:white;

    font-size:13px;

    margin-top:5px;

    opacity:.95;
}


/* ================= FORM CARD ================= */

.form-card{
    width:100%;

    background:#fff;

    border-radius:27px;

    padding:
        24px
        18px
        18px;

    box-shadow:
        0 12px 30px rgba(20,0,80,.22);

    margin-top:0;
}


/* ================= FORM ROW ================= */

.form-row{
    display:grid;

    grid-template-columns:
        60px
        1fr;

    gap:10px;

    align-items:start;

    margin-bottom:10px;
}


/* ================= SMALL ICON BOX ================= */

.field-icon{
    width:52px;
    height:52px;

    border-radius:13px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:26px;

    line-height:1;

    background:#f0e7ff;

    border:
        1px solid
        rgba(100,50,180,.10);

    /*
    আইকন বক্স নিজ নিজ
    Input / Textarea / File Box-এর
    Top-এর সঙ্গে Alignment
    */

    margin-top:29px;

    justify-self:start;
}


.field-icon.phone{
    background:#e8f5ff;
}

.field-icon.message{
    background:#f0e7ff;
}

.field-icon.file{
    background:#e4faf7;
}


/* ================= FIELD ================= */

.field{
    min-width:0;
}


/* ================= LABEL ================= */

.field-label{
    display:block;

    color:#17204a;

    font-size:19px;

    font-weight:900;

    margin-bottom:5px;

    line-height:1.2;
}


.required{
    color:#ef4164;
}


.optional{
    color:#999;

    font-size:15px;

    font-weight:500;
}


/* ================= INPUT ================= */

input[type="text"],
textarea{
    width:100%;

    border:
        2px solid
        #ddd0ea;

    background:#fcf9ff;

    border-radius:15px;

    outline:none;

    color:#333;

    font-family:inherit;

    font-size:18px;

    padding:
        13px
        17px;

    transition:.2s;
}


input[type="text"]{
    height:55px;
}


input[type="text"]:focus,
textarea:focus{
    border-color:#7139e9;

    box-shadow:
        0 0 0 3px
        rgba(113,57,233,.10);
}


.phone-input{
    background:#edf8ff !important;

    border-color:#bdddf0 !important;
}


/* ================= MESSAGE ================= */

textarea{
    height:175px;

    resize:none;
}


/* ================= FILE ================= */

.file-box{
    width:100%;

    border:
        3px dashed
        #64c4b8;

    background:#effbf9;

    border-radius:18px;

    padding:
        8px
        11px
        9px;
}


.file-title{
    color:#218b7d;

    font-size:18px;

    font-weight:900;

    margin-bottom:5px;
}


.file-input{
    width:100%;

    height:43px;

    background:white;

    border:
        1px solid
        #d9d9d9;

    border-radius:11px;

    padding:5px;

    font-size:14px;
}


.file-note{
    color:#6da69f;

    font-size:12px;

    margin-top:4px;
}


/* ================= BUTTON ================= */

.send-button{
    width:100%;

    height:62px;

    border:0;

    border-radius:17px;

    background:
        linear-gradient(
            90deg,
            #4a18ef,
            #8220e8,
            #ef00a7
        );

    color:white;

    font-family:inherit;

    font-size:23px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(100,0,220,.25);

    margin-top:2px;
}


.send-button:active{
    transform:scale(.99);
}


.send-button:disabled{
    opacity:.65;

    cursor:not-allowed;
}


.send-arrow{
    font-size:31px;

    vertical-align:-2px;

    margin-right:7px;
}


/* ================= SECURITY ================= */

.security{
    margin-top:10px;

    border:
        1px solid
        #f0dfad;

    background:#fffbea;

    border-radius:13px;

    text-align:center;

    padding:
        9px
        6px;

    color:#8d856d;

    font-size:12px;
}


/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:white;

    font-size:13px;

    padding:
        14px
        5px
        16px;

    text-shadow:
        0 1px 2px
        rgba(0,0,0,.25);
}


/* ================= MOBILE ================= */

@media(max-width:600px){

    .page{
        padding:
            10px
            14px
            0;
    }


    .header{
        padding-bottom:20px;
    }


    .hero-title{
        font-size:25px;

        line-height:1.18;

        max-width:100%;
    }


    .hero-title .line{
        white-space:nowrap;
    }


    .hero-decoration{
        margin-top:6px;
    }


    .hero-decoration i{
        width:45px;

        height:2px;
    }


    .hero-decoration b{
        font-size:21px;
    }


    .hero-subtitle{
        font-size:10px;
    }


    .form-card{
        padding:
            19px
            12px
            15px;

        border-radius:25px;
    }


    /* ================= MOBILE ROW ================= */

    .form-row{
        grid-template-columns:
            58px
            1fr;

        gap:8px;

        margin-bottom:9px;
    }


    /* ================= MOBILE ICON ================= */

    .field-icon{
        width:48px;
        height:48px;

        font-size:24px;

        border
