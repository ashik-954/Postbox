<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #6418e8 0%,
            #7b22e8 45%,
            #294eea 100%
        );

    color:#17203a;
    overflow-x:hidden;
}

/* ---------- Background decoration ---------- */

body::before{
    content:"";
    position:fixed;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:90px;
    right:-110px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:210px;
    height:210px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    bottom:-100px;
    left:-70px;
    pointer-events:none;
}

/* ---------- Main ---------- */

.page{
    width:100%;
    min-height:100vh;
    padding:22px 14px 10px;
    position:relative;
    z-index:1;
}

.container{
    width:100%;
    max-width:720px;
    margin:0 auto;
}

/* ---------- Header ---------- */

.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    padding:5px 10px 22px;
}

/* ---------- Profile ---------- */

.profile-area{
    width:230px;
    flex-shrink:0;
    text-align:center;
}

.profile-wrap{
    position:relative;
    width:190px;
    height:190px;
    margin:0 auto 8px;
}

.profile-image{
    width:100%;
    height:100%;
    display:block;

    object-fit:cover;

    /*
       ছবির মাথা যাতে কাটা না যায়
       এবং সামান্য নিচের দিকে থাকে
    */
    object-position:center 58%;

    border-radius:50%;

    border:7px solid transparent;

    background:
        linear-gradient(#7b20e8,#7b20e8) padding-box,
        linear-gradient(
            135deg,
            #19bfff,
            #d8a8ff,
            #ffffff,
            #35aaff
        ) border-box;

    box-shadow:
        0 5px 16px rgba(0,0,0,.25);
}

/* ---------- Profile Name ---------- */

.profile-name{
    color:#ffffff;
    font-size:21px;
    font-weight:800;
    text-shadow:
        0 2px 4px rgba(0,0,0,.3);
}

/* ---------- Message Header ---------- */

.message-head{
    width:300px;
    text-align:center;
    flex-shrink:0;
}

/* Message icon */

.message-icon{
    width:66px;
    height:66px;

    margin:0 auto 12px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    border:3px solid #ffffff;

    box-shadow:
        0 4px 12px rgba(0,0,0,.18);
}

.message-icon span{
    font-size:39px;
    line-height:1;
}

/* Main heading */

.main-title{
    color:#ffe94a;

    font-size:36px;
    line-height:1.18;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 4px rgba(0,0,0,.25);
}

.main-title span{
    display:block;
}

/* Decorative line */

.title-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    margin-top:12px;
}

.title-line{
    width:65px;
    height:2px;
    background:#ffffff;
    opacity:.9;
}

.heart{
    color:#ff9ab9;
    font-size:23px;
    line-height:1;
}

/* Small text */

.header-note{
    color:#ffffff;
    font-size:13px;
    line-height:1.5;
