<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>


<style>

/* ================= RESET ================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}


/* ================= BODY ================= */

body{

    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #6818e8 0%,
            #8120e8 45%,
            #214de0 100%
        );

    color:#17204a;

    overflow-x:hidden;
}


/* ================= BACKGROUND DECORATION ================= */

body::before,
body::after{

    content:"";

    position:fixed;

    border-radius:50%;

    background:
        rgba(255,255,255,.08);

    z-index:-1;

    pointer-events:none;
}

body::before{

    width:240px;
    height:240px;

    right:-90px;
    top:180px;
}

body::after{

    width:190px;
    height:190px;

    left:-90px;
    bottom:-60px;
}


/* ================= MAIN PAGE ================= */

.page{

    width:100%;

    max-width:760px;

    margin:0 auto;

    min-height:100vh;

    /*
       উপরে সামান্য অতিরিক্ত ফাঁকা জায়গা
    */

    padding:
        14px
        14px
        0;
}


/* ================= HEADER ================= */

.header{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:center;

    gap:15px;

    /*
       Header সামান্য বামে নেওয়া হয়েছে
    */

    transform:translateX(-5px);

    padding:
        2px
        3px
        9px;
}


/* ================= PROFILE ================= */

.profile-area{

    width:41%;

    max-width:220px;

    text-align:center;

    flex-shrink:0;
}


.profile-frame{

    width:105px;

    height:105px;

    margin:
        0
        auto
        3px;

    padding:4px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00cfff,
            #8b5cf6,
            #f4b4ff
        );

    box-shadow:
        0 0 0 2px
        rgba(255,255,255,.95),

        0 6px 16px
        rgba(20,0,80,.25);
}


.profile-frame img{

    width:100%;

    height:100%;

    display:block;

    border-radius:50%;

    object-fit:cover;

    /*
       মাথা যেন না কাটে
    */

    object-position:center 62%;

    background:#eee;
}


.profile-name{

    color:#ffffff;

    font-size:14px;

    font-weight:800;

    line-height:1.2;

    text-shadow:
        0 2px 4px
        rgba(0,0,0,.25);

    white-space:nowrap;
}


/* ================= HERO ================= */

.hero{

    flex:1;

    min-width:0;

    text-align:center;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* ================= MESSAGE ICON ================= */

.message-icon{

    width:41px;

    height:41px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(255,255,255,.08);

    border:
        2px solid #ffffff;

    margin:
        0
        auto
        4px;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.18);
}


.message-icon span{

    font-size:21px;

    line-height:1;

    display:block;
}


/* ================= HERO TITLE ================= */

.hero-title{

    width:100%;

    color:#fff13b;

    font-size:
        clamp(
            21px,
            5.2vw,
            34px
        );

    line-height:1.12;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px
        rgba(0,0,0,.35);
}


/*
   দুই লাইন
*/

.hero-title .line{

    display:block;

    width:100%;

    text-align:center;

    white-space:nowrap;
}


/* ================= HERO DECORATION ================= */

.hero-decoration{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:5px;

    margin-top:4px;
}


.hero-decoration i{

    display:block;

    width:27px;

    height:2px;

    background:#ffffff;

    border-radius:10px;
}


.hero-decoration b{

    color:#ff9dc9;

    font-size:16px;

    line-height:1;
}


.hero-subtitle{

    color:#ffffff;

    font-size:8px;

    line-height:1.25;

    margin-top:2px;

    opacity:.95;
}


/* ================= FORM CARD ================= */

.form-card{

    width:100%;

    background:#ffffff;

    border-radius:21px;

    padding:
        13px
        9px
        10px;

    box-shadow:
        0 12px 30px
        rgba(20,0,80,.22);

    margin-top:1px;
}


/* ================= FORM ROW ================= */

.form-row{

    display:grid;

    grid-template-columns:
        56px
        minmax(0,1fr);

    gap:8px;

    align-items:start;

    margin-bottom:8px;
}


/* ================= FIELD ICON ================= */

.field-icon{

    width:56px;

    height:56px;

    border-radius:13px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:27px;

    background:#f0e7ff;

    border:
        1px solid
        rgba(100,50,180,.10);
}


.field-icon.phone{

    background:#e8f5ff;
}


.field-icon.message{

    background:#f0e7ff;
}


.field-icon.file{

    background:#e4faf7;
}


/* ================= FIELD ================= */

.field{

    min-width:0;
}


.field-label{

    display:block;

    color:#17204a;

    font-size:14px;

    font-weight:900;

    line-height:1.25;

    margin-bottom:3px;
}


.required{

    color:#ef4164;
}


.optional{

    color:#999;

    font-size:11px;

    font-weight:500;
}


/* ================= INPUT ================= */

input[type="text"],
textarea{

    width:100%;

    border:
        2px solid
        #ddd0ea;

    background:#fcf9ff;

    border-radius:13px;

    outline:none;

    color:#333;

    font-family:inherit;

    font-size:14px;

    padding:
        8px
        11px;

    transition:.2s;
}


input[type="text"]{

    height:43px;
}


input[type="text"]:focus,
textarea:focus{

    border-color:#7139e9;

    box-shadow:
        0 0 0 3px
        rgba(113,57,233,.10);
}


.phone-input{

    background:#edf8ff !important;

    border-color:#bdddf0 !important;
}


/* ================= MESSAGE BOX ================= */

/*
   আগের থেকে সামান্য লম্বা
*/

textarea{

    height:158px;

    resize:none;

    line-height:1.45;
}


/* ================= FILE ================= */

.file-box{

    width:100%;

    border:
        2px dashed
        #64c4b8;

    background:#effbf9;

    border-radius:12px;

    padding:
        5px
        7px
        6px;
}


.file-title{

    color:#218b7d;

    font-size:11px;

    font-weight:900;

    line-height:1.25;

    margin-bottom:2px;
}


.file-input{

    width:100%;

    height:34px;

    background:#ffffff;

    border:
        1px solid
        #d9d9d9;

    border-radius:9px;

    padding:3px;

    font-size:10px;
}


.file-note{

    color:#6da69f;

    font-size:8px;

    line-height:1.2;

    margin-top:2px;
}


/* ================= SEND BUTTON ================= */

.send-button{

    width:100%;

    height:51px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            90deg,
            #4a18ef,
            #8220e8,
            #ef00a7
        );

    color:#ffffff;

    font-family:inherit;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(100,0,220,.25);

    margin-top:0;
}


.send-button:active{

    transform:scale(.99);
}


.send-arrow{

    font-size:22px;

    vertical-align:-2px;

    margin-right:6px;
}


/* ================= SECURITY ================= */

.security{

    margin-top:6px;

    border:
        1px solid
        #f0dfad;

    background:#fffbea;

    border-radius:10px;

    text-align:center;

    padding:
        5px
        3px;

    color:#8d856d;

    font-size:8px;

    line-height:1.3;
}


/* ================= FOOTER ================= */

.footer{

    text-align:center;

    color:#ffffff;

    font-size:8px;

    line-height:1.2;

    padding:
        6px
        3px
        7px;

    text-shadow:
        0 1px 2px
        rgba(0,0,0,.25);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{

        /*
           উপরে নতুন সামান্য জায়গা
        */

        padding:
            12px
            9px
            0;
    }


    .header{

        gap:7px;

        /*
           মোবাইলেও Header সামান্য বামে
        */

        transform:translateX(-5px);

        padding:
            1px
            2px
            7px;
    }


    /* PROFILE */

    .profile-area{

        width:42%;
    }


    .profile-frame{

        width:105px;

        height:105px;

        padding:4px;

        margin-bottom:3px;
    }


    .profile-name{

        font-size:14px;
    }


    /* HERO */

    .hero{

        width:58%;
    }


    /* MESSAGE ICON */

    .message-icon{

        width:41px;

        height:41px;

        border-width:2px;

        margin-bottom:4px;
    }


    .message-icon span{

        font-size:21px;
    }


    /* TITLE */

    .hero-title{

        font-size:22px;

        line-height:1.12;

        width:100%;
    }


    .hero-title .line{

        white-space:nowrap;

        text-align:center;
    }


    .hero-decoration{

        margin-top:4px;

        gap:5px;
    }


    .hero-decoration i{

        width:27px;

        height:2px;
    }


    .hero-decoration b{

        font-size:16px;
    }


    .hero-subtitle{

        font-size:8px;

        margin-top:2px;
    }


    /* FORM */

    .form-card{

        padding:
            13px
            9px
            10px;

        border-radius:21px;

        margin-top:1px;
    }


    .form-row{

        grid-template-columns:
            56px
            minmax(0,1fr);

        gap:8px;

        margin-bottom:8px;
    }


    .field-icon{

        width:56px;

        height:56px;

        border-radius:13px;

        font-size:27px;
    }


    .field-label{

        font-size:14px;

        margin-bottom:3px;
    }


    .optional{

        font-size:11px;
    }


    input[type="text"]{

        height:43px;

        font-size:14px;

        padding:
            8px
            11px;
    }


    /*
       মোবাইলে Message box
       আগের 105px থেকে 158px
    */

    textarea{

        height:158px;

        font-size:14px;

        padding:
            9px
            11px;
    }


    /* FILE */

    .file-box{

        border-width:2px;

        border-radius:12px;

        padding:
            5px
            7px
            6px;
    }


    .file-title{

        font-size:11px;

        margin-bottom:2px;
    }


    .file-input{

        height:34px;

        font-size:10px;
    }


    .file-note{

        font-size:8px;

        margin-top:2px;
    }


    /* BUTTON */

    .send-button{

        height:51px;

        border-radius:13px;

        font-size:18px;
    }


    .send-arrow{

        font-size:22px;
    }


    /* SECURITY */

    .security{

        margin-top:6px;

        padding:
            5px
            3px;

        font-size:8px;
    }


    /* FOOTER */

    .footer{

        font-size:8px;

        padding:
            6px
            3px
            7px;
    }

}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:380px){

    .page{

        padding:
            10px
            8px
            0;
    }


    .header{

        gap:4px;

        transform:translateX(-4px);
    }


    .profile-frame{

        width:96px;

        height:96px;
    }


    .profile-name{

        font-size:13px;
    }


    .message-icon{

        width:38px;

        height:38px;
    }


    .message-icon span{

        font-size:19px;
    }


    .hero-title{

        font-size:19px;
    }


    .hero-subtitle{

        font-size:7px;
    }


    .form-row{

        grid-template-columns:
            52px
            minmax(0,1fr);
    }


    .field-icon{

        width:52px;

        height:52px;

        font-size:25px;
    }


    textarea{

        height:150px;
    }

}

</style>

</head>


<body>


<div class="page">


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- PROFILE -->

    <div class="profile-area">

        <div class="profile-frame">

            <img
                src="1000.png"
                alt="আশিকুর রহমান"
            >

        </div>


        <div class="profile-name">
            আশিকুর রহমান
        </div>

    </div>


    <!-- HERO -->

    <div class="hero">


        <div class="message-icon">

            <span>💬</span>

        </div>


        <div class="hero-title">

            <span class="line">
                আপনার কথা
            </span>

            <span class="line">
                আমার কাছে পৌঁছে দিন
            </span>

        </div>


        <div class="hero-decoration">

            <i></i>

            <b>♥</b>

            <i></i>

        </div>


        <div class="hero-subtitle">

            বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!

        </div>

    </div>

</header>


<!-- ================= FORM ================= -->

<main class="form-card">


    <!-- NAME -->

    <div class="form-row">


        <div class="field-icon">

            👤

        </div>


        <div class="field">


            <label class="field-label">

                আপনার নাম

                <span class="required">
                    *
                </span>

            </label>


            <input
                type="text"
                name="name"
                placeholder="আপনার নাম লিখুন"
                autocomplete="name"
            >

        </div>

    </div>


    <!-- CONTACT -->

    <div class="form-row">


        <div class="field-icon phone">

            📞

        </div>


        <div class="field">


            <label class="field-label">

                যোগাযোগ

                <span class="optional">
                    (ঐচ্ছিক)
                </span>

            </label>


            <input
                type="text"
                name="contact"
                class="phone-input"
                placeholder="নাম্বার, ই-মেইল অথবা লিংক"
            >

        </div>

    </div>


    <!-- MESSAGE -->

    <div class="form-row">


        <div class="field-icon message">

            💬

        </div>


        <div class="field">


            <label class="field-label">

                আপনার মেসেজ

                <span class="required">
                    *
                </span>

            </label>


            <textarea
                name="message"
                placeholder="আপনার কথা এখানে লিখুন..."
            ></textarea>

        </div>

    </div>


    <!-- FILE -->

    <div class="form-row">


        <div class="field-icon file">

            📎

        </div>


        <div class="field">


            <label class="field-label">

                ফাইল সংযুক্ত করুন

                <span class="optional">
                    (ঐচ্ছিক)
                </span>

            </label>


            <div class="file-box">


                <div class="file-title">

                    📎 ছবি, PDF বা অন্যান্য ফাইল

                </div>


                <input
                    type="file"
                    class="file-input"
                    name="file"
                    accept="image/*,.pdf"
                >


                <div class="file-note">

                    সর্বোচ্চ ২০ MB · একবারে ১টি ফাইল

                </div>


            </div>

        </div>

    </div>


    <!-- SEND -->

    <button
        type="button"
        class="send-button"
        onclick="sendMessage()"
    >

        <span class="send-arrow">
            ➤
        </span>

        মেসেজ পাঠান

    </button>


    <!-- SECURITY -->

    <div class="security">

        🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।

    </div>


</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️

</footer>


</div>


<script>


/* ================= FILE SIZE CHECK ================= */

const fileInput =
    document.querySelector(
        '.file-input'
    );


if(fileInput){

    fileInput.addEventListener(
        'change',
        function(){

            if(!this.files.length){
                return;
            }


            const file =
                this.files[0];


            const maxSize =
                20 * 1024 * 1024;


            if(file.size > maxSize){

                alert(
                    'ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।'
                );


                this.value = '';

            }

        }
    );

}


/* ================= SEND ================= */

function sendMessage(){


    const name =
        document
        .querySelector('[name="name"]')
        .value
        .trim();


    const message =
        document
        .querySelector('[name="message"]')
        .value
        .trim();


    if(!name){

        alert(
            'দয়া করে আপনার নাম লিখুন।'
        );

        return;
    }


    if(!message){

        alert(
            'দয়া করে আপনার মেসেজ লিখুন।'
        );

        return;
    }


    /*
       Google Apps Script
       পরে এখানে যুক্ত করা হবে।
    */


    alert(
        'মেসেজ প্রস্তুত হয়েছে।'
    );

}

</script>


</body>

</html>
