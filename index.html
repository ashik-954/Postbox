<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #6418e8 0%,
            #7b22e8 45%,
            #294eea 100%
        );

    color:#17203a;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:90px;
    right:-110px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:210px;
    height:210px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    bottom:-100px;
    left:-70px;
    pointer-events:none;
}

/* ================= PAGE ================= */

.page{
    width:100%;
    min-height:100vh;
    padding:8px 14px 6px;
    position:relative;
    z-index:1;
}

.container{
    width:100%;
    max-width:720px;
    margin:0 auto;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:center;

    gap:22px;

    padding:3px 8px 13px;
}

/* ================= PROFILE ================= */

.profile-area{
    width:210px;
    flex-shrink:0;
    text-align:center;
}

.profile-wrap{
    position:relative;

    width:160px;
    height:160px;

    margin:0 auto 6px;
}

.profile-image{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    /* মাথা যাতে না কাটে */
    object-position:center 58%;

    border-radius:50%;

    border:6px solid transparent;

    background:
        linear-gradient(#7b20e8,#7b20e8) padding-box,
        linear-gradient(
            135deg,
            #19bfff,
            #d8a8ff,
            #ffffff,
            #35aaff
        ) border-box;

    box-shadow:
        0 5px 16px rgba(0,0,0,.25);
}

/* ================= PROFILE NAME ================= */

.profile-name{
    color:#ffffff;

    font-size:19px;

    font-weight:800;

    text-shadow:
        0 2px 4px rgba(0,0,0,.3);
}

/* ================= MESSAGE HEADER ================= */

.message-head{
    width:285px;

    flex-shrink:0;

    text-align:center;
}

/* ================= SMALL MESSAGE ICON ================= */

.message-icon{
    width:49px;
    height:49px;

    margin:0 auto 8px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    border:2px solid #ffffff;

    box-shadow:
        0 3px 9px rgba(0,0,0,.18);
}

.message-icon span{
    font-size:24px;

    line-height:1;
}

/* ================= TWO LINE TITLE ================= */

.main-title{
    color:#ffe94a;

    /*
       নির্দিষ্টভাবে দুই লাইনের জন্য
    */
    font-size:30px;

    line-height:1.22;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 4px rgba(0,0,0,.25);
}

/*
   প্রতিটি span একটি সম্পূর্ণ লাইন
*/
.main-title span{
    display:block;

    width:100%;

    white-space:nowrap;

    text-align:center;
}

/* ================= TITLE DECORATION ================= */

.title-decoration{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:7px;
}

.title-line{
    width:55px;

    height:2px;

    background:#ffffff;

    opacity:.9;
}

.heart{
    color:#ff9ab9;

    font-size:19px;

    line-height:1;
}

/* ================= HEADER NOTE ================= */

.header-note{
    color:#ffffff;

    font-size:11px;

    line-height:1.4;

    margin-top:5px;
}

/* ================= FORM CARD ================= */

.form-card{
    width:100%;

    background:#ffffff;

    border-radius:24px;

    padding:19px 22px 13px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.20);
}

/* ================= FORM ROW ================= */

.form-row{
    display:grid;

    grid-template-columns:62px 1fr;

    gap:12px;

    margin-bottom:11px;
}

/* ================= FORM ICON ================= */

.form-icon{
    width:56px;
    height:56px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:29px;

    background:#eee5ff;

    border:1px solid rgba(100,40,230,.08);
}

.form-row:nth-child(2) .form-icon{
    background:#e4f3ff;
}

.form-row:nth-child(3) .form-icon{
    background:#eee5ff;
}

.file-row .form-icon{
    background:#dff9f3;
}

/* ================= LABEL ================= */

.field-label{
    display:block;

    font-size:15px;

    font-weight:800;

    color:#17203a;

    margin-bottom:5px;
}

.required{
    color:#e53962;
}

.optional{
    color:#888;

    font-size:12px;

    font-weight:500;
}

/* ================= INPUT ================= */

.input,
.message-box{
    width:100%;

    border:2px solid #ddd1e9;

    border-radius:13px;

    background:#fbf9fd;

    color:#222;

    font-family:inherit;

    outline:none;

    transition:.2s;
}

.input{
    height:47px;

    padding:0 14px;

    font-size:15px;
}

.input:focus,
.message-box:focus{
    border-color:#6d24e9;

    box-shadow:
        0 0 0 3px rgba(109,36,233,.10);
}

.contact-input{
    background:#eef8ff;

    border-color:#c5dfef;
}

/* ================= MESSAGE BOX ================= */

.message-box{
    height:105px;

    min-height:105px;

    max-height:160px;

    resize:vertical;

    padding:11px 14px;

    font-size:14px;

    line-height:1.5;
}

/* ================= FILE BOX ================= */

.file-box{
    width:100%;

    /*
       width অপরিবর্তিত,
       height কমানোর জন্য padding কম
    */

    border:2px dashed #62c3b5;

    border-radius:13px;

    background:#effcf9;

    padding:7px 10px;
}

/* ================= FILE TITLE ================= */

.file-title{
    color:#248f82;

    font-size:13px;

    font-weight:800;

    margin-bottom:4px;
}

/* ================= FILE INPUT ================= */

.file-input{
    width:100%;

    background:#ffffff;

    border:1px solid #ddd;

    border-radius:8px;

    padding:4px;

    font-size:12px;
}

.file-info{
    color:#6d9c96;

    font-size:9px;

    margin-top:3px;
}

/* ================= SUBMIT ================= */

.submit-btn{
    width:100%;

    height:50px;

    border:none;

    border-radius:13px;

    margin-top:0;

    background:
        linear-gradient(
            90deg,
            #4520e8,
            #7b21e8,
            #ef00a8
        );

    color:#ffffff;

    font-family:inherit;

    font-size:17px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 6px 14px rgba(93,30,225,.28);

    transition:.2s;
}

.submit-btn:active{
    transform:scale(.98);
}

.submit-btn:hover{
    filter:brightness(1.06);
}

.send-arrow{
    font-size:22px;

    vertical-align:-2px;

    margin-right:6px;
}

/* ================= SECURITY ================= */

.security{
    margin-top:8px;

    padding:7px 9px;

    border-radius:9px;

    background:#fff9e7;

    border:1px solid #f0dfad;

    text-align:center;

    color:#8c8064;

    font-size:10px;

    line-height:1.35;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:#ffffff;

    font-size:9px;

    padding:5px 0 1px;

    opacity:.95;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    .page{
        padding:6px 9px 5px;
    }

    .header{
        gap:8px;

        padding-top:1px;

        padding-bottom:10px;
    }

    .profile-area{
        width:45%;
    }

    .profile-wrap{
        width:118px;
        height:118px;

        margin-bottom:5px;
    }

    .profile-image{
        border-width:5px;
    }

    .profile-name{
        font-size:15px;
    }

    .message-head{
        width:55%;
    }

    /* মোবাইলে আরও ছোট */

    .message-icon{
        width:43px;
        height:43px;

        margin-bottom:6px;

        border-width:2px;
    }

    .message-icon span{
        font-size:21px;
    }

    .main-title{
        font-size:25px;

        line-height:1.22;
    }

    .main-title span{
        white-space:nowrap;
    }

    .title-decoration{
        margin-top:6px;

        gap:6px;
    }

    .title-line{
        width:36px;
    }

    .heart{
        font-size:16px;
    }

    .header-note{
        font-size:9px;

        margin-top:4px;
    }

    .form-card{
        padding:16px 12px 11px;

        border-radius:20px;
    }

    .form-row{
        grid-template-columns:50px 1fr;

        gap:8px;

        margin-bottom:10px;
    }

    .form-icon{
        width:50px;
        height:50px;

        border-radius:12px;

        font-size:26px;
    }

    .field-label{
        font-size:14px;

        margin-bottom:4px;
    }

    .input{
        height:45px;

        font-size:14px;
    }

    .message-box{
        height:100px;

        min-height:100px;

        font-size:14px;
    }

    .file-box{
        padding:6px 8px;
    }

    .file-title{
        font-size:12px;
    }

    .file-input{
        font-size:11px;

        padding:3px;
    }

    .file-info{
        font-size:8px;
    }

    .submit-btn{
        height:49px;

        font-size:16px;
    }

    .security{
        margin-top:7px;

        padding:6px 8px;

        font-size:9px;
    }

    .footer{
        font-size:8px;

        padding-top:4px;
    }
}

/* ================= VERY SMALL PHONE ================= */

@media(max-width:390px){

    .header{
        gap:4px;
    }

    .profile-wrap{
        width:108px;
        height:108px;
    }

    .profile-name{
        font-size:14px;
    }

    .message-icon{
        width:40px;
        height:40px;
    }

    .message-icon span{
        font-size:19px;
    }

    .main-title{
        font-size:23px;
    }

    .title-line{
        width:30px;
    }

    .form-card{
        padding-left:9px;
        padding-right:9px;
    }

    .form-row{
        grid-template-columns:46px 1fr;
    }

    .form-icon{
        width:46px;
        height:46px;

        font-size:24px;
    }
}
</style>
</head>


<body>

<div class="page">

<div class="container">


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- PROFILE -->

    <div class="profile-area">

        <div class="profile-wrap">

            <img
                src="1000.png"
                alt="আশিকুর রহমান"
                class="profile-image"
            >

        </div>

        <div class="profile-name">
            আশিকুর রহমান
        </div>

    </div>


    <!-- MESSAGE HEADER -->

    <div class="message-head">


        <!-- ছোট মেসেজ আইকন -->

        <div class="message-icon">

            <span>💬</span>

        </div>


        <!-- ঠিক দুই লাইন -->

        <h1 class="main-title">

            <span>আপনার কথা</span>

            <span>আমার কাছে পৌঁছে দিন</span>

        </h1>


        <div class="title-decoration">

            <div class="title-line"></div>

            <div class="heart">♥</div>

            <div class="title-line"></div>

        </div>


        <div class="header-note">

            বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!

        </div>

    </div>

</header>


<!-- ================= FORM ================= -->

<main class="form-card">

<form
    id="messageForm"
    enctype="multipart/form-data"
>


<!-- NAME -->

<div class="form-row">

    <div class="form-icon">
        👤
    </div>

    <div>

        <label class="field-label">

            আপনার নাম
            <span class="required">*</span>

        </label>

        <input
            type="text"
            name="name"
            class="input"
            placeholder="আপনার নাম লিখুন"
            required
        >

    </div>

</div>


<!-- CONTACT -->

<div class="form-row">

    <div class="form-icon">
        📞
    </div>

    <div>

        <label class="field-label">

            যোগাযোগ
            <span class="optional">(ঐচ্ছিক)</span>

        </label>

        <input
            type="text"
            name="contact"
            class="input contact-input"
            placeholder="নাম্বার, ই-মেইল অথবা লিংক"
        >

    </div>

</div>


<!-- MESSAGE -->

<div class="form-row">

    <div class="form-icon">
        💬
    </div>

    <div>

        <label class="field-label">

            আপনার মেসেজ
            <span class="required">*</span>

        </label>

        <textarea
            name="message"
            class="message-box"
            placeholder="আপনার কথা এখানে লিখুন..."
            required
        ></textarea>

    </div>

</div>


<!-- FILE -->

<div class="form-row file-row">

    <div class="form-icon">
        📎
    </div>

    <div>

        <label class="field-label">

            ফাইল সংযুক্ত করুন
            <span class="optional">(ঐচ্ছিক)</span>

        </label>


        <div class="file-box">

            <div class="file-title">

                📎 ছবি, PDF বা অন্যান্য ফাইল

            </div>


            <input
                type="file"
                name="attachment"
                id="attachment"
                class="file-input"
            >


            <div class="file-info">

                সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল

            </div>

        </div>

    </div>

</div>


<!-- SUBMIT -->

<button
    type="submit"
    class="submit-btn"
>

    <span class="send-arrow">➤</span>

    মেসেজ পাঠান

</button>


<!-- SECURITY -->

<div class="security">

    🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।

</div>

</form>

</main>


<!-- FOOTER -->

<footer class="footer">

    🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️

</footer>


</div>

</div>


<script>

/* ==========================================
   20 MB FILE SIZE CHECK
========================================== */

const fileInput =
    document.getElementById("attachment");

fileInput.addEventListener(
    "change",
    function(){

        if(!this.files.length){
            return;
        }

        const file =
            this.files[0];

        const maxSize =
            20 * 1024 * 1024;

        if(file.size > maxSize){

            alert(
                "ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।"
            );

            this.value = "";
        }

    }
);


/* ==========================================
   TEMPORARY FORM TEST
========================================== */

const form =
    document.getElementById("messageForm");

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        alert(
            "মেসেজ পাঠানোর ব্যবস্থা এখনো Google Apps Script-এর সঙ্গে সংযুক্ত করা হয়নি।"
        );

    }
);

</script>

</body>
</html>
