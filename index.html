<!doctype html><html lang="bn"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>আমাকে একটি মেসেজ পাঠান</title><style>body{font-family:Arial,sans-serif;background:#f3f5ff;padding:20px}main{max-width:520px;margin:auto;background:white;padding:28px;border-radius:22px;box-shadow:0 10px 30px #0001}input,textarea,button{width:100%;box-sizing:border-box;padding:14px;margin:8px 0 14px;border-radius:12px;border:1px solid #ccd2e0;font-size:16px}textarea{min-height:150px}button{background:#4f46e5;color:white;border:0;font-weight:bold}.hint{font-size:13px;color:#667085}#status{text-align:center;font-weight:bold}</style><main><h1>আমাকে একটি মেসেজ পাঠান</h1><p>আপনার কথা বা মতামত লিখে পাঠান। চাইলে একটি ফাইল সংযুক্ত করতে পারেন।</p><form id="f"><label>আপনার নাম</label><input id="n" required maxlength="100" placeholder="নাম লিখুন"><label>মোবাইল নম্বর (ঐচ্ছিক)</label><input id="p" maxlength="30" placeholder="01XXXXXXXXX"><label>মেসেজ</label><textarea id="m" required maxlength="2000" placeholder="মেসেজ লিখুন..."></textarea><label>ফাইল (ঐচ্ছিক)</label><input id="file" type="file"><div class="hint">সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল</div><button id="b">মেসেজ পাঠান</button><div id="status"></div></form></main><script>
const API_URL="https://script.google.com/macros/s/AKfycbyd0ldrrTOYJvptf3G4IZPdUq33z_Xb5PvCNzimy6zU7-jVNJpBO7IPuZ-Brrgp7GfBKQ/exec",MAX=20*1024*1024,f=document.getElementById("f"),b=document.getElementById("b"),s=document.getElementById("status");
f.onsubmit=async e=>{e.preventDefault();let x=document.getElementById("file").files[0];if(x&&x.size>MAX){s.textContent="ফাইল ২০ MB-এর বেশি হতে পারবে না।";return}if(API_URL.includes("PASTE_YOUR")){s.textContent="প্রথমে API URL বসাতে হবে।";return}b.disabled=true;b.textContent="পাঠানো হচ্ছে...";try{let fd=null;if(x)fd=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok({name:x.name,mimeType:x.type||"application/octet-stream",data:r.result.split(",")[1]});r.onerror=no;r.readAsDataURL(x)});let r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:n.value.trim(),phone:p.value.trim(),message:m.value.trim(),file:fd})}),j=await r.json();if(!j.success)throw Error(j.error);f.reset();s.textContent="✓ আপনার মেসেজ সফলভাবে পাঠানো হয়েছে।"}catch(e){s.textContent="মেসেজ পাঠানো যায়নি। আবার চেষ্টা করুন।"}finally{b.disabled=false;b.textContent="মেসেজ পাঠান"}};
</script></html>
