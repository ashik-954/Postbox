<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            145deg,
            #6818e8 0%,
            #8120e8 45%,
            #214de0 100%
        );

    color:#17204a;
    overflow-x:hidden;
}


/* ================= BACKGROUND ================= */

body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    z-index:-1;
    pointer-events:none;
}

body::before{
    width:240px;
    height:240px;
    right:-90px;
    top:180px;
}

body::after{
    width:190px;
    height:190px;
    left:-90px;
    bottom:-60px;
}


/* ================= MAIN ================= */

.page{
    width:100%;
    max-width:760px;
    margin:0 auto;
    min-height:100vh;

    padding:
        7px
        14px
        0;
}


/* ================= HEADER ================= */

.header{
    width:100%;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:15px;

    padding:
        2px
        3px
        9px;
}


/* ================= PROFILE ================= */

.profile-area{
    width:41%;
    max-width:220px;

    text-align:center;

    flex-shrink:0;
}

.profile-frame{

    /*
       আগের 148px থেকে ছোট করা হয়েছে
    */

    width:118px;
    height:118px;

    margin:
        0
        auto
        4px;

    padding:5px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00cfff,
            #8b5cf6,
            #f4b4ff
        );

    box-shadow:
        0 0 0 2px rgba(255,255,255,.95),
        0 6px 16px rgba(20,0,80,.25);
}

.profile-frame img{

    width:100%;
    height:100%;

    display:block;

    border-radius:50%;

    object-fit:cover;

    /*
       ছবির মাথা যেন না কাটে
    */

    object-position:center 62%;

    background:#eee;
}

.profile-name{

    color:#ffffff;

    font-size:16px;

    font-weight:800;

    line-height:1.2;

    text-shadow:
        0 2px 4px rgba(0,0,0,.25);

    white-space:nowrap;
}


/* ================= HERO ================= */

.hero{

    flex:1;

    min-width:0;

    text-align:center;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;
}


/* ================= MESSAGE ICON ================= */

.message-icon{

    /*
       আগের 58px থেকে ছোট
    */

    width:45px;
    height:45px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(255,255,255,.08);

    border:
        3px solid #ffffff;

    margin:
        0
        auto
        5px;

    box-shadow:
        0 3px 10px rgba(0,0,0,.18);
}

.message-icon span{

    /*
       ভেতরের 💬 চিহ্নও ছোট
    */

    font-size:23px;

    line-height:1;

    display:block;
}


/* ================= MAIN TITLE ================= */

.hero-title{

    width:100%;

    color:#fff13b;

    /*
       ছোট স্ক্রিনে যেন বাইরে না যায়
    */

    font-size:
        clamp(
            21px,
            5.2vw,
            34px
        );

    line-height:1.15;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 3px rgba(0,0,0,.35);
}


/*
   দুই লাইন নিশ্চিত
*/

.hero-title .line{

    display:block;

    width:100%;

    text-align:center;

    white-space:nowrap;
}


/* ================= TITLE DECORATION ================= */

.hero-decoration{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:6px;

    margin-top:5px;
}

.hero-decoration i{

    display:block;

    width:35px;

    height:2px;

    background:#ffffff;

    border-radius:10px;
}

.hero-decoration b{

    color:#ff9dc9;

    font-size:18px;

    line-height:1;
}

.hero-subtitle{

    color:#ffffff;

    font-size:9px;

    line-height:1.25;

    margin-top:3px;

    opacity:.95;
}


/* ================= FORM CARD ================= */

.form-card{

    width:100%;

    background:#ffffff;

    border-radius:25px;

    padding:
        16px
        13px
        12px;

    box-shadow:
        0 12px 30px rgba(20,0,80,.22);

    margin-top:2px;
}


/* ================= FORM ROW ================= */

.form-row{

    display:grid;

    grid-template-columns:
        64px
        minmax(0,1fr);

    gap:9px;

    align-items:start;

    margin-bottom:9px;
}


/* ================= FIELD ICON ================= */

.field-icon{

    width:64px;
    height:64px;

    border-radius:16px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:31px;

    background:#f0e7ff;

    border:
        1px solid
        rgba(100,50,180,.10);
}

.field-icon.phone{
    background:#e8f5ff;
}

.field-icon.message{
    background:#f0e7ff;
}

.field-icon.file{
    background:#e4faf7;
}


/* ================= FIELD ================= */

.field{

    min-width:0;
}

.field-label{

    display:block;

    color:#17204a;

    font-size:16px;

    font-weight:900;

    line-height:1.25;

    margin-bottom:4px;
}

.required{
    color:#ef4164;
}

.optional{

    color:#999;

    font-size:12px;

    font-weight:500;
}


/* ================= INPUT ================= */

input[type="text"],
textarea{

    width:100%;

    border:
        2px solid
        #ddd0ea;

    background:#fcf9ff;

    border-radius:13px;

    outline:none;

    color:#333;

    font-family:inherit;

    font-size:15px;

    padding:
        10px
        13px;

    transition:.2s;
}

input[type="text"]{

    height:47px;
}

input[type="text"]:focus,
textarea:focus{

    border-color:#7139e9;

    box-shadow:
        0 0 0 3px
        rgba(113,57,233,.10);
}

.phone-input{

    background:#edf8ff !important;

    border-color:#bdddf0 !important;
}


/* ================= MESSAGE BOX ================= */

textarea{

    height:120px;

    resize:none;

    line-height:1.45;
}


/* ================= FILE ================= */

.file-box{

    width:100%;

    border:
        2px dashed
        #64c4b8;

    background:#effbf9;

    border-radius:14px;

    /*
       উচ্চতা কম রাখা হয়েছে
    */

    padding:
        6px
        8px
        7px;
}

.file-title{

    color:#218b7d;

    font-size:13px;

    font-weight:900;

    line-height:1.25;

    margin-bottom:3px;
}

.file-input{

    width:100%;

    height:37px;

    background:#ffffff;

    border:
        1px solid
        #d9d9d9;

    border-radius:9px;

    padding:3px;

    font-size:11px;
}

.file-note{

    color:#6da69f;

    font-size:9px;

    line-height:1.2;

    margin-top:3px;
}


/* ================= SEND BUTTON ================= */

.send-button{

    width:100%;

    height:54px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            90deg,
            #4a18ef,
            #8220e8,
            #ef00a7
        );

    color:#ffffff;

    font-family:inherit;

    font-size:19px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 18px
        rgba(100,0,220,.25);

    margin-top:0;
}

.send-button:active{

    transform:scale(.99);
}

.send-arrow{

    font-size:25px;

    vertical-align:-2px;

    margin-right:6px;
}


/* ================= SECURITY ================= */

.security{

    margin-top:7px;

    border:
        1px solid
        #f0dfad;

    background:#fffbea;

    border-radius:10px;

    text-align:center;

    padding:
        6px
        4px;

    color:#8d856d;

    font-size:9px;

    line-height:1.3;
}


/* ================= FOOTER ================= */

.footer{

    text-align:center;

    color:#ffffff;

    font-size:9px;

    line-height:1.2;

    padding:
        7px
        5px
        8px;

    text-shadow:
        0 1px 2px rgba(0,0,0,.25);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .page{

        padding:
            5px
            9px
            0;
    }

    .header{

        gap:7px;

        padding:
            1px
            2px
            7px;
    }


    /* PROFILE */

    .profile-area{

        width:42%;
    }

    .profile-frame{

        width:105px;
        height:105px;

        padding:4px;

        margin-bottom:3px;
    }

    .profile-name{

        font-size:14px;
    }


    /* HERO */

    .hero{

        width:58%;
    }


    /* SMALL MESSAGE ICON */

    .message-icon{

        width:41px;
        height:41px;

        border-width:2px;

        margin-bottom:4px;
    }

    .message-icon span{

        font-size:21px;
    }


    /* TWO LINE TITLE */

    .hero-title{

        font-size:22px;

        line-height:1.12;
    }

    .hero-title .line{

        white-space:nowrap;

        text-align:center;
    }


    .hero-decoration{

        margin-top:4px;

        gap:5px;
    }

    .hero-decoration i{

        width:27px;

        height:2px;
    }

    .hero-decoration b{

        font-size:16px;
    }

    .hero-subtitle{

        font-size:8px;

        margin-top:2px;
    }


    /* FORM */

    .form-card{

        padding:
            13px
            9px
            10px;

        border-radius:21px;

        margin-top:1px;
    }

    .form-row{

        grid-template-columns:
            56px
            minmax(0,1fr);

        gap:8px;

        margin-bottom:8px;
    }

    .field-icon{

        width:56px;
        height:56px;

        border-radius:13px;

        font-size:27px;
    }

    .field-label{

        font-size:14px;

        margin-bottom:3px;
    }

    .optional{

        font-size:11px;
    }

    input[type="text"]{

        height:43px;

        font-size:14px;

        padding:
            8px
            11px;
    }

    textarea{

        height:105px;

        font-size:14px;

        padding:
            9px
            11px;
    }


    /* FILE */

    .file-box{

        border-width:2px;

        border-radius:12px;

        padding:
            5px
            7px
            6px;
    }

    .file-title{

        font-size:11px;

        margin-bottom:2px;
    }

    .file-input{

        height:34px;

        font-size:10px;
    }

    .file-note{

        font-size:8px;

        margin-top:2px;
    }


    /* BUTTON */

    .send-button{

        height:51px;

        border-radius:13px;

        font-size:18px;
    }

    .send-arrow{

        font-size:22px;
    }


    /* SECURITY */

    .security{

        margin-top:6px;

        padding:
            5px
            3px;

        font-size:8px;
    }


    /* FOOTER */

    .footer{

        font-size:8px;

        padding:
            6px
            3px
            7px;
    }
}


/* =====================================================
   VERY SMALL PHONE
===================================================== */

@media(max-width:380px){

    .header{

        gap:4px;
    }

    .profile-frame{

        width:96px;
        height:96px;
    }

    .profile-name{

        font-size:13px;
    }

    .message-icon{

        width:38px;
        height:38px;
    }

    .message-icon span{

        font-size:19px;
    }

    .hero-title{

        font-size:19px;
    }

    .hero-subtitle{

        font-size:7px;
    }

    .form-row{

        grid-template-columns:
            52px
            minmax(0,1fr);
    }

    .field-icon{

        width:52px;
        height:52px;

        font-size:25px;
    }
}

</style>
</head>


<body>

<div class="page">


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- PROFILE -->

    <div class="profile-area">

        <div class="profile-frame">

            <img
                src="1000.png"
                alt="আশিকুর রহমান"
            >

        </div>

        <div class="profile-name">
            আশিকুর রহমান
        </div>

    </div>


    <!-- MESSAGE HEADER -->

    <div class="hero">

        <div class="message-icon">
            <span>💬</span>
        </div>


        <!-- TWO LINE TITLE -->

        <div class="hero-title">

            <span class="line">
                আপনার কথা
            </span>

            <span class="line">
                আমার কাছে পৌঁছে দিন
            </span>

        </div>


        <div class="hero-decoration">

            <i></i>

            <b>♥</b>

            <i></i>

        </div>


        <div class="hero-subtitle">
            বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!
        </div>

    </div>

</header>


<!-- ================= FORM ================= -->

<main class="form-card">


    <!-- NAME -->

    <div class="form-row">

        <div class="field-icon">
            👤
        </div>

        <div class="field">

            <label class="field-label">
                আপনার নাম
                <span class="required">*</span>
            </label>

            <input
                type="text"
                name="name"
                placeholder="আপনার নাম লিখুন"
                autocomplete="name"
            >

        </div>

    </div>


    <!-- CONTACT -->

    <div class="form-row">

        <div class="field-icon phone">
            📞
        </div>

        <div class="field">

            <label class="field-label">

                যোগাযোগ

                <span class="optional">
                    (ঐচ্ছিক)
                </span>

            </label>

            <input
                type="text"
                name="contact"
                class="phone-input"
                placeholder="নাম্বার, ই-মেইল অথবা লিংক"
            >

        </div>

    </div>


    <!-- MESSAGE -->

    <div class="form-row">

        <div class="field-icon message">
            💬
        </div>

        <div class="field">

            <label class="field-label">

                আপনার মেসেজ

                <span class="required">
                    *
                </span>

            </label>

            <textarea
                name="message"
                placeholder="আপনার কথা এখানে লিখুন..."
            ></textarea>

        </div>

    </div>


    <!-- FILE -->

    <div class="form-row">

        <div class="field-icon file">
            📎
        </div>

        <div class="field">

            <label class="field-label">

                ফাইল সংযুক্ত করুন

                <span class="optional">
                    (ঐচ্ছিক)
                </span>

            </label>


            <div class="file-box">

                <div class="file-title">
                    📎 ছবি, PDF বা অন্যান্য ফাইল
                </div>

                <input
                    type="file"
                    class="file-input"
                    name="file"
                    accept="image/*,.pdf"
                >

                <div class="file-note">
                    সর্বোচ্চ ২০ MB · একবারে ১টি ফাইল
                </div>

            </div>

        </div>

    </div>


    <!-- SEND BUTTON -->

    <button
        type="button"
        class="send-button"
        onclick="sendMessage()"
    >

        <span class="send-arrow">
            ➤
        </span>

        মেসেজ পাঠান

    </button>


    <!-- SECURITY -->

    <div class="security">

        🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।

    </div>


</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️

</footer>


</div>


<script>

/* ================= FILE SIZE CHECK ================= */

const fileInput =
    document.querySelector(
        '.file-input'
    );

if(fileInput){

    fileInput.addEventListener(
        'change',
        function(){

            if(!this.files.length){
                return;
            }

            const file =
                this.files[0];

            const maxSize =
                20 * 1024 * 1024;

            if(file.size > maxSize){

                alert(
                    'ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।'
                );

                this.value = '';
            }

        }
    );
}


/* ================= SEND ================= */

function sendMessage(){

    const name =
        document
        .querySelector('[name="name"]')
        .value
        .trim();

    const message =
        document
        .querySelector('[name="message"]')
        .value
        .trim();


    if(!name){

        alert(
            'দয়া করে আপনার নাম লিখুন।'
        );

        return;
    }


    if(!message){

        alert(
            'দয়া করে আপনার মেসেজ লিখুন।'
        );

        return;
    }


    /*
      Google Apps Script
      এখানে সংযুক্ত করা হবে।
    */

    alert(
        'মেসেজ প্রস্তুত হয়েছে।'
    );

}

</script>

</body>
</html>
