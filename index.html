<!doctype html>
<html lang="bn">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>আপনার কথা, আমার কাছে পৌঁছে দিন</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  font-family:
    "Noto Sans Bengali",
    "Noto Sans",
    Arial,
    sans-serif;

  color:#171331;

  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.22),transparent 24%),
    radial-gradient(circle at 90% 25%,rgba(79,70,229,.25),transparent 30%),
    linear-gradient(
      135deg,
      #5b21d8 0%,
      #7138dc 32%,
      #3039b9 68%,
      #1649b8 100%
    );

  overflow-x:hidden;
}


/* Decorative background */

body::before{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  top:-180px;
  right:-120px;
  pointer-events:none;
}

body::after{
  content:"";
  position:fixed;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  bottom:-220px;
  left:-160px;
  pointer-events:none;
}


/* Main wrapper */

.page{
  width:100%;
  max-width:1050px;
  margin:auto;
  padding:28px 18px 35px;
}


/* =========================
   HERO
========================= */

.hero{
  position:relative;
  min-height:500px;

  padding:48px 45px 105px;

  border-radius:40px 40px 0 0;

  overflow:hidden;

  background:
    radial-gradient(circle at 80% 15%,rgba(255,255,255,.12),transparent 25%),
    linear-gradient(
      135deg,
      #5f20d5,
      #5424b9 45%,
      #214bc1
    );

  box-shadow:
    0 25px 70px rgba(20,10,70,.28);
}


/* Decorative waves */

.hero::before{
  content:"";
  position:absolute;

  width:720px;
  height:330px;

  right:-170px;
  top:-170px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      rgba(255,255,255,.15),
      rgba(255,255,255,0)
    );

  transform:rotate(-18deg);
}

.hero::after{
  content:"";
  position:absolute;

  width:700px;
  height:230px;

  left:-170px;
  bottom:-150px;

  border-radius:50%;

  background:
    rgba(255,255,255,.08);

  transform:rotate(8deg);
}


/* Hero layout */

.hero-content{
  position:relative;
  z-index:2;

  display:grid;
  grid-template-columns:330px 1fr;

  gap:50px;

  align-items:center;
}


/* =========================
   PROFILE
========================= */

.profile-area{
  text-align:center;
}

.profile-wrap{
  position:relative;

  width:315px;
  height:315px;

  margin:auto;
}


/* Outer ring */

.profile-ring{
  position:absolute;
  inset:0;

  padding:10px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #fff,
      #ffd6ef,
      #bfa2ff,
      #fff
    );

  box-shadow:
    0 12px 35px rgba(0,0,0,.25);
}


/* Photo */

.profile-photo{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;

  /*
   * ছবির মাথা যেন কেটে না যায়
   */
  object-position:center 23%;

  border-radius:50%;

  border:7px solid white;

  background:#eee;
}


/* Verification badge */

.badge{
  position:absolute;

  right:3px;
  bottom:15px;

  width:62px;
  height:62px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#fff;

  border:6px solid rgba(255,255,255,.7);

  box-shadow:
    0 8px 22px rgba(0,0,0,.22);

  color:#5b21d8;

  font-size:29px;
  font-weight:900;
}


/* Name */

.profile-name{
  margin:17px 0 0;

  color:#fff;

  font-size:31px;
  font-weight:900;

  text-shadow:
    0 3px 8px rgba(0,0,0,.18);
}


/* Decorative name line */

.name-decoration{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:12px;

  margin-top:8px;
}

.name-decoration span{
  width:80px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #ff8fda
    );
}

.name-decoration span:last-child{
  background:
    linear-gradient(
      90deg,
      #ff8fda,
      transparent
    );
}

.name-decoration b{
  color:#ff8fda;
  font-size:20px;
}


/* =========================
   HERO TEXT
========================= */

.hero-text{
  position:relative;
  z-index:2;

  padding-bottom:15px;
}


/* Message bubble */

.hero-icon{
  width:76px;
  height:76px;

  margin-bottom:15px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:
    rgba(255,255,255,.12);

  border:1px solid rgba(255,255,255,.2);

  color:#fff;

  box-shadow:
    0 8px 25px rgba(0,0,0,.12);
}


/* SVG */

.hero-icon svg{
  width:48px;
  height:48px;
}


/* Title */

h1{
  margin:0;

  color:#fff;

  font-size:55px;

  line-height:1.16;

  font-weight:900;

  letter-spacing:-1.2px;
}

.title-line{
  display:block;
}

.title-line.second{
  color:#ffd84d;

  margin-top:4px;
}


/* Divider */

.hero-divider{
  display:flex;
  align-items:center;

  gap:14px;

  margin:24px 0 18px;
}

.hero-divider::before{
  content:"";

  width:220px;
  height:2px;

  background:
    linear-gradient(
      90deg,
      rgba(255,255,255,.85),
      rgba(255,255,255,.05)
    );
}

.hero-heart{
  color:#ff8dbb;
  font-size:25px;
}


/* Subtitle */

.subtitle{
  margin:0;

  color:rgba(255,255,255,.94);

  font-size:22px;

  line-height:1.7;

  font-weight:500;
}


/* Decorative paper plane */

.paper-plane{
  position:absolute;

  right:25px;
  top:55px;

  color:#ff9be7;

  opacity:.9;
}

.paper-plane svg{
  width:65px;
  height:65px;
}


/* =========================
   FORM CARD
========================= */

.form-card{
  position:relative;
  z-index:5;

  margin-top:-70px;

  padding:45px;

  border-radius:32px;

  background:
    rgba(255,255,255,.97);

  box-shadow:
    0 25px 65px rgba(20,10,70,.22);

  border:
    1px solid rgba(255,255,255,.8);
}


/* Field */

.field{
  display:grid;

  grid-template-columns:95px 1fr;

  gap:22px;

  margin-bottom:24px;

  align-items:start;
}


/* Field icon */

.field-icon{
  width:90px;
  height:90px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:19px;

  border:1px solid rgba(100,70,200,.12);

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,.4);
}

.field-icon svg{
  width:46px;
  height:46px;
}


/* Icon colors */

.icon-user{
  color:#6527d9;
  background:linear-gradient(135deg,#f2e7ff,#ead
