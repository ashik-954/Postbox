<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>মেসেজ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:15px;
  font-family:Arial,sans-serif;

  background:linear-gradient(
    135deg,
    #6417e8,
    #7424e9,
    #234fe8
  );
}

.container{
  max-width:650px;
  margin:auto;
}

.header{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:25px;
  padding:15px 5px 20px;
}

.photo-area{
  position:relative;
  flex-shrink:0;
}

.profile{
  width:125px;
  height:125px;

  object-fit:cover;
  object-position:50% 40%;

  border-radius:50%;

  border:6px solid transparent;

  background:
    linear-gradient(white,white) padding-box,
    linear-gradient(
      135deg,
      #19cfff,
      #7047ff,
      #d946ef
    ) border-box;

  display:block;
}

.verify{
  position:absolute;
  right:-4px;
  bottom:-2px;

  width:42px;
  height:42px;

  border-radius:50%;

  border:5px solid #102b73;

  background:white;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#168be8;
  font-size:25px;
  font-weight:bold;
}

.hero{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.icon{
  width:45px;
  height:45px;

  border-radius:50%;

  border:3px solid white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;

  margin-bottom:8px;
}

.title{
  color:white;
  font-size:26px;
  font-weight:bold;
  line-height:1.2;
  text-align:center;
}

.title span{
  display:block;
}

.title span:last-child{
  color:#fff044;
}

.name{
  color:white;
  text-align:center;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

.test{
  background:white;
  border-radius:20px;
  padding:20px;
  text-align:center;
  font-size:18px;
  color:#222;
}

@media(max-width:500px){

  .header{
    gap:12px;
  }

  .profile{
    width:110px;
    height:110px;
  }

  .verify{
    width:38px;
    height:38px;
    font-size:22px;
  }

  .title{
    font-size:21px;
  }

  .icon{
    width:40px;
    height:40px;
    font-size:20px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="photo-area">

      <img
        class="profile"
        src="1000.png"
        alt="আশিকুর রহমান"
      >

      <div class="verify">✓</div>

      <div class="name">
        আশিকুর রহমান
      </div>

    </div>

    <div class="hero">

      <div class="icon">
        💬
      </div>

      <div class="title">
        <span>আপনার কথা</span>
        <span>আমার কাছে পৌঁছে দিন</span>
      </div>

    </div>

  </div>

  <div class="test">
    আপনার কথা এখানে লিখুন
  </div>

</div>

</body>
</html>
