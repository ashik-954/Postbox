<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আপনার কথা আমার কাছে পৌঁছে দিন</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Noto Sans",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #5520e8 0%,
            #7929e8 45%,
            #304eea 100%
        );

    color:#18204a;
    overflow-x:hidden;
}

/* Decorative background */
body::before,
body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    z-index:0;
}

body::before{
    width:190px;
    height:190px;
    left:-80px;
    bottom:-60px;
    background:rgba(255,255,255,.09);
}

body::after{
    width:220px;
    height:220px;
    right:-100px;
    top:130px;
    background:rgba(255,255,255,.08);
}

/* Main wrapper */
.page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:24px 14px 12px;
}

/* =========================
   TOP SECTION
========================= */

.hero{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:42px;
    min-height:320px;
    padding:5px 10px 20px;
}

/* Photo area */
.profile-area{
    flex:0 0 300px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.profile-photo-wrap{
    position:relative;
    width:280px;
    height:280px;
}

.profile-photo{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:50%;
    border:9px solid rgba(255,255,255,.95);
    box-shadow:
        0 0 0 4px rgba(255,220,245,.8),
        0 12px 35px rgba(25,0,70,.25);
    display:block;
}

.check{
    position:absolute;
    right:-5px;
    bottom:5px;

    width:58px;
    height:58px;

    border-radius:50%;
    background:#fff;

    border:4px solid #1688e8;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#147fe0;
    font-size:35px;
    font-weight:900;

    box-shadow:0 5px 14px rgba(0,0,0,.18);
}

.profile-name{
    margin-top:13px;
    color:white;
    font-size:23px;
    font-weight:800;
    text-align:center;
}

.name-line{
    margin-top:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
}

.name-line span{
    display:block;
    width:58px;
    height:2px;
    background:rgba(255,255,255,.55);
}

.name-heart{
    color:#ff9fcf;
    font-size:21px;
}

/* Text area */
.hero-text{
    flex:1;
    min-width:0;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.message-icon{
    width:58px;
    height:58px;
    border:3px solid white;
    border-radius:50%;

    background:rgba(255,255,255,.12);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;
    margin-bottom:18px;

    box-shadow:0 5px 15px rgba(0,0,0,.12);
}

.hero-title{
    color:#fff;

    font-size:44px;
    line-height:1.16;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 3px 8px rgba(0,0,0,.20);

    margin:0;
}

.hero-subtitle{
    margin-top:18px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;

    width:100%;
}

.hero-subtitle::before,
.hero-subtitle::after{
    content:"";
    width:70px;
    height:2px;
    background:rgba(255,255,255,.65);
}

.hero-heart{
    color:#ff9bc9;
    font-size:22px;
}

.hero-small{
    margin-top:12px;
    color:rgba(255,255,255,.88);
    font-size:15px;
    text-align:center;
}

/* =========================
   FORM CARD
========================= */

.form-card{
    width:100%;
    background:#fff;
    border-radius:24px;

    padding:25px 25px 18px;

    box-shadow:
        0 18px 45px rgba(25,0,80,.22);

    margin-top:5px;
}

/* Form rows */
.form-row{
    display:grid;
    grid-template-columns:68px 1fr;
    gap:14px;

    margin-bottom:15px;
}

.form-icon{
    width:58px;
    height:58px;

    border-radius:15px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:31px;

    background:#eee7ff;
    border:1px solid #ddd1ff;
}

.form-content{
    width:100%;
}

label{
    display:block;
    margin-bottom:7px;

    font-size:17px;
    font-weight:800;

    color:#25284e;
}

.required{
    color:#e63755;
}

.optional{
    font-size:13px;
    color:#888;
    font-weight:500;
}

input[type="text"],
input[type="tel"],
input[type="email"],
textarea{
    width:100%;

    border:1.5px solid #d7cbea;
    border-radius:13px;

    background:#fbf8ff;

    color:#222;

    font-family:inherit;
    font-size:16px;

    padding:13px 15px;

    outline:none;

    transition:.2s;
}

input[type="text"]:focus,
input[type="tel"]:focus,
input[type="email"]:focus,
textarea:focus{
    border-color:#7134e8;

    box-shadow:
        0 0 0 3px rgba(113,52,232,.10);
}

.contact-input{
    background:#eff9ff !important;
    border-color:#afd7ed !important;
}

textarea{
    height:155px;
    min-height:155px;
    resize:vertical;
}

/* =========================
   FILE UPLOAD
========================= */

.file-box{
    border:2px dashed #6bc8bb;
    border-radius:15px;

    background:#effcf9;

    padding:12px;
}

.file-title{
    color:#168879;
    font-size:15px;
    font-weight:800;
    margin-bottom:8px;
}

input[type="file"]{
    width:100%;
    padding:8px;

    border:1px solid #d6d6d6;
    border-radius:10px;

    background:white;

    font-size:14px;
}

.file-info{
    margin-top:7px;
    color:#6b918d;
    font-size:11px;
}

.file-selected{
    margin-top:7px;
    padding:6px 8px;

    border-radius:8px;

    background:#d9f5ee;

    color:#397d72;

    font-size:11px;

    display:none;
}

/* =========================
   SEND BUTTON
========================= */

.send-button{
    width:100%;

    border:0;
    border-radius:13px;

    padding:13px;

    background:
        linear-gradient(
            90deg,
            #4920e8,
            #8c22e8,
            #ec008c
        );

    color:white;

    font-family:inherit;
    font-size:18px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(114,30,220,.25);

    transition:.2s;

    margin-top:2px;
}

.send-button:hover{
    transform:translateY(-1px);
}

.send-button:active{
    transform:scale(.99);
}

.send-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* Status */
.status{
    margin-top:10px;
    min-height:0;

    text-align:center;

    font-size:14px;
    font-weight:700;
}

.success{
    color:#168a61;
}

.error{
    color:#d92d45;
}

/* Privacy */
.privacy{
    margin-top:12px;

    padding:10px;

    border-radius:11px;

    background:#fff9e7;
    border:1px solid #f0dfae;

    text-align:center;

    color:#81754c;

    font-size:11px;
}

/* Footer */
.footer{
    text-align:center;

    color:rgba(255,255,255,.90);

    font-size:12px;

    padding:9px 0 0;
}

/* =========================
   TABLET
========================= */

@media(max-width:760px){

    .page{
        padding:18px 10px 8px;
    }

    .hero{
        gap:25px;
        min-height:265px;
    }

    .profile-area{
        flex-basis:235px;
    }

    .profile-photo-wrap{
        width:220px;
        height:220px;
    }

    .profile-name{
        font-size:18px;
    }

    .check{
        width:48px;
        height:48px;
        font-size:28px;
    }

    .hero-title{
        font-size:34px;
    }

    .hero-small{
        font-size:12px;
    }

    .form-card{
        padding:20px 18px 15px;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .page{
        padding:12px 8px 6px;
    }

    .hero{
        display:flex;

        gap:13px;

        min-height:260px;

        padding:5px 2px 14px;
    }

    .profile-area{
        flex:0 0 48%;
    }

    .profile-photo-wrap{
        width:min(210px,43vw);
        height:min(210px,43vw);
    }

    .profile-photo{
        border-width:7px;
    }

    .check{
        width:43px;
        height:43px;
        right:-2px;
        bottom:2px;

        font-size:25px;
        border-width:3px;
    }

    .profile-name{
        margin-top:8px;
        font-size:15px;
    }

    .name-line{
        margin-top:4px;
        gap:7px;
    }

    .name-line span{
        width:38px;
    }

    .name-heart{
        font-size:16px;
    }

    .hero-text{
        flex:1;
    }

    .message-icon{
        width:47px;

        font-size:24px;
        margin-bottom:10px;
        border-width:2px;
    }

    .hero-title{
        font-size:28px;
        line-height:1.18;
    }

    .hero-subtitle{
        margin-top:10px;
