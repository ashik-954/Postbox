<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আপনার কথা, আমার কাছে পৌঁছে দিন</title>

<meta name="theme-color" content="#5424e8">

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Noto Sans Bengali",Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,255,255,.10),transparent 25%),
        radial-gradient(circle at 90% 20%,rgba(255,255,255,.08),transparent 25%),
        linear-gradient(135deg,#6121df 0%,#5424e8 42%,#244fe0 100%);
    min-height:100vh;
    color:#17104d;
    overflow-x:hidden;
}

/* Background decorations */
body::before{
    content:"";
    position:fixed;
    width:420px;
    height:420px;
    border-radius:50%;
    background:rgba(255,255,255,.055);
    top:-180px;
    right:-140px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:330px;
    height:330px;
    border-radius:50%;
    background:rgba(255,255,255,.045);
    bottom:-170px;
    left:-150px;
    pointer-events:none;
}

/* Main wrapper */
.page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:22px 18px 35px;
    position:relative;
    z-index:1;
}

/* ================= HEADER ================= */

.hero{
    position:relative;
    min-height:370px;
    padding:30px 35px 25px;
    border-radius:34px 34px 0 0;
    overflow:hidden;
    background:
        radial-gradient(circle at 85% 15%,rgba(255,255,255,.12),transparent 25%),
        linear-gradient(135deg,#6822dd,#4725cf 48%,#244ddc);
    color:#fff;
}

.hero::before{
    content:"";
    position:absolute;
    width:430px;
    height:240px;
    background:rgba(255,255,255,.055);
    border-radius:50%;
    right:-100px;
    top:-100px;
    transform:rotate(-18deg);
}

.hero::after{
    content:"";
    position:absolute;
    width:500px;
    height:210px;
    background:rgba(255,255,255,.045);
    border-radius:50%;
    left:300px;
    bottom:-150px;
    transform:rotate(-12deg);
}

/* hero content */
.hero-content{
    position:relative;
    z-index:2;
    display:grid;
    grid-template-columns:330px 1fr;
    align-items:center;
    gap:42px;
}

/* Profile section */
.profile-section{
    text-align:center;
    position:relative;
}

.profile-wrap{
    width:285px;
    height:285px;
    margin:0 auto 10px;
    position:relative;
}

/* outer decorative ring */
.profile-wrap::before{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    background:linear-gradient(
        135deg,
        #ffffff,
        #b9d7ff,
        #ffb8e8,
        #ffffff
    );
    box-shadow:
        0 0 0 4px rgba(255,255,255,.28),
        0 15px 35px rgba(21,0,100,.28);
}

/* profile image */
.profile-image{
    position:relative;
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;

    /* মাথার উপরের অতিরিক্ত ফাঁকা অংশ কমানো */
    object-position:50% 34%;

    border:8px solid #fff;
    display:block;
    background:#ddd;
    z-index:2;
}

/* verification badge */
.verify-badge{
    position:absolute;
    z-index:5;
    width:58px;
    height:58px;
    right:-13px;
    bottom:0px;
    border-radius:50%;
    background:#fff;

    /* নীল outline */
    border:4px solid #1677e8;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 12px rgba(0,0,0,.22),
        0 0 0 3px rgba(255,255,255,.9);
}

.verify-badge span{
    color:#1677e8;
    font-family:Arial,sans-serif;
    font-size:34px;
    line-height:1;
    font-weight:900;
    transform:translateY(-2px);
}

.profile-name{
    color:#fff;
    font-size:28px;
    font-weight:800;
    text-shadow:0 2px 5px rgba(0,0,0,.2);
}

.name-decoration{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:6px;
}

.name-decoration::before,
.name-decoration::after{
    content:"";
    width:70px;
    height:2px;
    background:linear-gradient(
        to right,
        transparent,
        #ff9ed7
    );
}

.name-decoration::after{
    background:linear-gradient(
        to left,
        transparent,
        #ff9ed7
    );
}

.name-decoration span{
    color:#ff9ed7;
    font-size:18px;
}

/* Hero text */
.hero-text{
    position:relative;
    z-index:2;
    padding-bottom:10px;
}

.message-icon{
    width:64px;
    height:64px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.8);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin-bottom:16px;
    background:rgba(255,255,255,.08);
}

.hero-title{
    font-size:49px;
    line-height:1.22;
    font-weight:800;
    letter-spacing:-1px;
}

.hero-title .white{
    color:#fff;
    display:block;
}

.hero-title .yellow{
    color:#ffd94d;
    display:block;
}

.title-line{
    display:flex;
    align-items:center;
    gap:12px;
    margin:19px 0 12px;
}

.title-line::before{
    content:"";
    width:245px;
    max-width:65%;
    height:2px;
    background:rgba(255,255,255,.75);
}

.title-line span{
    color:#ff8fcf;
    font-size:25px;
}

.hero-subtitle{
    font-size:20px;
    color:#fff;
    opacity:.96;
    line-height:1.7;
}

/* paper plane */
.plane{
    position:absolute;
    right:15px;
    top:65px;
    color:#ff91d2;
    font-size:54px;
    transform:rotate(-8deg);
    z-index:3;
}

/* ================= FORM CARD ================= */

.form-card{
    position:relative;
    margin-top:-4px;
    background:rgba(255,255,255,.97);
    border-radius:28px;
    padding:35px 38px 30px;
    box-shadow:
        0 25px 60px rgba(22,0,85,.22),
        0 2px 8px rgba(0,0,0,.08);
    z-index:3;
}

.form-row{
    display:grid;
    grid-template-columns:105px 1fr;
    gap:24px;
    align-items:start;
    margin-bottom:27px;
}

.field-icon{
    width:76px;
    height:76px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:39px;
    margin:auto;
    border:1px solid rgba(80,40,220,.15);
}

.icon-purple{
    background:linear-gradient(145deg,#f2e5ff,#ead9ff);
}

.icon-blue{
    background:linear-gradient(145deg,#e5f3ff,#d8ebff);
}

.icon-green{
    background:linear-gradient(145deg,#e2faf6,#d7f4f0);
}

.field-label{
    display:block;
    font-size:21px;
    font-weight:800;
    margin-bottom:8px;
    color:#15104d;
}

.optional{
    font-size:16px;
    font-weight:400;
    color:#777;
}

.required{
    color:#e11d48;
    font-size:18px;
}

input[type="text"],
textarea{
    width:100%;
    border:1.5px solid #d8b9ee;
    border-radius:15px;
    background:#fbf4ff;
    color:#222;
    outline:none;
    font-family:inherit;
    font-size:18px;
    padding:15px 18px;
    transition:.2s;
}

input[type="text"]::placeholder,
textarea::placeholder{
    color:#9993a4;
}

input[type="text"]:focus,
textarea:focus{
    border-color:#6b31e9;
    box-shadow:0 0 0 4px rgba(107,49,233,.10);
}

.contact-input{
    background:#eef8ff !important;
    border-color:#9ec7e9 !important;
}

textarea{
    min-height:170px;
    resize:vertical;
    line-height:1.65;
}

/* File */
.file-box{
    border:2px dashed #49b8a8;
    border-radius:15px;
    background:#eefbf8;
    padding:16px 18px;
}

.file-title{
    color:#157c6e;
    font-size:17px;
    font-weight:700;
    margin-bottom:10px;
}

input[type="file"]{
    width:100%;
    font-family:Arial,sans-serif;
    font-size:15px;
    background:#fff;
    border:1px solid #d8d8d8;
    border-radius:10px;
    padding:7px;
}

.file-note{
    color:#398d82;
    font-size:13px;
    margin-top:8px;
}

/* Submit */
.submit-btn{
    width:100%;
    border:none;
    border-radius:16px;
    padding:17px 20px;
    background:linear-gradient(
        90deg,
        #4b
