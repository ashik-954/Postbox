<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>আমাকে একটি মেসেজ পাঠান</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Noto Sans Bengali",
        "Nirmala UI",
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #6418e8 0%,
            #7b22e8 45%,
            #294eea 100%
        );

    color:#17203a;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

body::before{
    content:"";
    position:fixed;
    width:260px;
    height:260px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    top:90px;
    right:-110px;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    width:210px;
    height:210px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    bottom:-100px;
    left:-70px;
    pointer-events:none;
}

/* ================= PAGE ================= */

.page{
    width:100%;
    min-height:100vh;
    padding:12px 14px 8px;
    position:relative;
    z-index:1;
}

.container{
    width:100%;
    max-width:720px;
    margin:0 auto;
}

/* ================= HEADER ================= */

.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:26px;
    padding:4px 10px 17px;
}

/* ================= PROFILE ================= */

.profile-area{
    width:215px;
    flex-shrink:0;
    text-align:center;
}

.profile-wrap{
    position:relative;

    /* আগের থেকে সামান্য ছোট */
    width:168px;
    height:168px;

    margin:0 auto 7px;
}

.profile-image{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    /*
       ছবির মাথা যেন না কাটে
    */
    object-position:center 58%;

    border-radius:50%;

    border:6px solid transparent;

    background:
        linear-gradient(#7b20e8,#7b20e8) padding-box,
        linear-gradient(
            135deg,
            #19bfff,
            #d8a8ff,
            #ffffff,
            #35aaff
        ) border-box;

    box-shadow:
        0 5px 16px rgba(0,0,0,.25);
}

/* ================= PROFILE NAME ================= */

.profile-name{
    color:#ffffff;

    font-size:20px;

    font-weight:800;

    text-shadow:
        0 2px 4px rgba(0,0,0,.3);
}

/* ================= MESSAGE HEADER ================= */

.message-head{
    width:290px;

    text-align:center;

    flex-shrink:0;
}

/* ================= MESSAGE ICON ================= */

.message-icon{
    /*
       আগের থেকে সামান্য ছোট
    */
    width:57px;
    height:57px;

    margin:0 auto 10px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.08);

    border:3px solid #ffffff;

    box-shadow:
        0 4px 12px rgba(0,0,0,.18);
}

.message-icon span{
    font-size:33px;
    line-height:1;
}

/* ================= MAIN TITLE ================= */

.main-title{
    color:#ffe94a;

    font-size:36px;

    line-height:1.18;

    font-weight:900;

    text-align:center;

    text-shadow:
        0 2px 4px rgba(0,0,0,.25);
}

.main-title span{
    display:block;
}

/* ================= TITLE DECORATION ================= */

.title-decoration{
    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    margin-top:10px;
}

.title-line{
    width:60px;
    height:2px;

    background:#ffffff;

    opacity:.9;
}

.heart{
    color:#ff9ab9;

    font-size:21px;

    line-height:1;
}

/* ================= HEADER NOTE ================= */

.header-note{
    color:#ffffff;

    font-size:12px;

    line-height:1.5;

    margin-top:6px;
}

/* ================= FORM CARD ================= */

.form-card{
    width:100%;

    background:#ffffff;

    border-radius:24px;

    padding:21px 22px 15px;

    box-shadow:
        0 12px 35px rgba(0,0,0,.20);
}

/* ================= FORM ROW ================= */

.form-row{
    display:grid;

    grid-template-columns:65px 1fr;

    gap:13px;

    margin-bottom:13px;
}

/* ================= FORM ICON ================= */

.form-icon{
    width:58px;
    height:58px;

    border-radius:15px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:31px;

    background:#eee5ff;

    border:1px solid rgba(100,40,230,.08);
}

.form-row:nth-child(2) .form-icon{
    background:#e4f3ff;
}

.form-row:nth-child(3) .form-icon{
    background:#eee5ff;
}

.file-row .form-icon{
    background:#dff9f3;
}

/* ================= LABEL ================= */

.field-label{
    display:block;

    font-size:16px;

    font-weight:800;

    color:#17203a;

    margin-bottom:6px;
}

.required{
    color:#e53962;
}

.optional{
    color:#888;

    font-size:13px;

    font-weight:500;
}

/* ================= INPUT ================= */

.input,
.message-box{
    width:100%;

    border:2px solid #ddd1e9;

    border-radius:14px;

    background:#fbf9fd;

    color:#222;

    font-family:inherit;

    outline:none;

    transition:.2s;
}

.input{
    height:49px;

    padding:0 15px;

    font-size:15px;
}

.input:focus,
.message-box:focus{
    border-color:#6d24e9;

    box-shadow:
        0 0 0 3px rgba(109,36,233,.10);
}

.contact-input{
    background:#eef8ff;

    border-color:#c5dfef;
}

/* ================= MESSAGE BOX ================= */

.message-box{
    /*
       মেসেজ বক্স আগের থেকে ছোট
    */

    height:115px;

    min-height:115px;

    max-height:170px;

    resize:vertical;

    padding:12px 15px;

    font-size:15px;

    line-height:1.55;
}

/* ================= FILE BOX ================= */

.file-box{
    width:100%;

    /*
       Width সম্পূর্ণ অপরিবর্তিত
       শুধু vertical space কমানো হয়েছে
    */

    border:2px dashed #62c3b5;

    border-radius:14px;

    background:#effcf9;

    padding:8px 11px;
}

/* ================= FILE TITLE ================= */

.file-title{
    color:#248f82;

    /*
       লেখাটি সামান্য ছোট
    */

    font-size:14px;

    font-weight:800;

    margin-bottom:5px;
}

/* ================= FILE INPUT ================= */

.file-input{
    width:100%;

    background:#ffffff;

    border:1px solid #ddd;

    border-radius:9px;

    padding:5px;

    font-size:13px;
}

.file-info{
    color:#6d9c96;

    font-size:10px;

    margin-top:4px;
}

/* ================= SUBMIT ================= */

.submit-btn{
    width:100%;

    height:54px;

    border:none;

    border-radius:14px;

    margin-top:1px;

    background:
        linear-gradient(
            90deg,
            #4520e8,
            #7b21e8,
            #ef00a8
        );

    color:#ffffff;

    font-family:inherit;

    font-size:18px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 7px 15px rgba(93,30,225,.28);

    transition:.2s;
}

.submit-btn:active{
    transform:scale(.98);
}

.submit-btn:hover{
    filter:brightness(1.06);
}

.send-arrow{
    font-size:23px;

    vertical-align:-2px;

    margin-right:7px;
}

/* ================= SECURITY ================= */

.security{
    margin-top:10px;

    padding:8px 10px;

    border-radius:10px;

    background:#fff9e7;

    border:1px solid #f0dfad;

    text-align:center;

    color:#8c8064;

    font-size:11px;

    line-height:1.4;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;

    color:#ffffff;

    font-size:10px;

    padding:6px 0 1px;

    opacity:.95;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

    .page{
        padding:8px 10px 6px;
    }

    .header{
        gap:12px;

        padding-top:2px;

        padding-bottom:13px;
    }

    .profile-area{
        width:45%;
    }

    .profile-wrap{

        width:128px;
        height:128px;

    }

    .profile-image{
        border-width:5px;
    }

    .profile-name{
        font-size:16px;
    }

    .message-head{
        width:55%;
    }

    .message-icon{

        width:49px;
        height:49px;

        margin-bottom:7px;
    }

    .message-icon span{
        font-size:28px;
    }

    .main-title{
        font-size:28px;

        line-height:1.18;
    }

    .title-decoration{
        margin-top:7px;
    }

    .title-line{
        width:42px;
    }

    .header-note{
        font-size:10px;
    }

    .form-card{
        padding:18px 13px 13px;

        border-radius:21px;
    }

    .form-row{
        grid-template-columns:52px 1fr;

        gap:9px;

        margin-bottom:12px;
    }

    .form-icon{
        width:52px;
        height:52px;

        border-radius:13px;

        font-size:27px;
    }

    .field-label{
        font-size:15px;
    }

    .input{
        height:47px;

        font-size:14px;
    }

    .message-box{
        height:105px;

        min-height:105px;

        font-size:14px;
    }

    .file-box{
        padding:7px 9px;
    }

    .file-title{
        font-size:13px;
    }

    .file-input{
        padding:4px;

        font-size:12px;
    }

    .file-info{
        font-size:9px;
    }

    .submit-btn{
        height:51px;

        font-size:17px;
    }
}

/* ================= SMALL PHONE ================= */

@media(max-width:390px){

    .header{
        gap:6px;
    }

    .profile-wrap{
        width:118px;
        height:118px;
    }

    .main-title{
        font-size:25px;
    }

    .message-icon{
        width:45px;
        height:45px;
    }

    .message-icon span{
        font-size:25px;
    }

    .form-card{
        padding-left:10px;
        padding-right:10px;
    }

    .form-row{
        grid-template-columns:48px 1fr;
    }

    .form-icon{
        width:48px;
        height:48px;

        font-size:25px;
    }
}
</style>
</head>


<body>

<div class="page">

<div class="container">


<!-- ================= HEADER ================= -->

<header class="header">


    <!-- PROFILE -->

    <div class="profile-area">

        <div class="profile-wrap">

            <img
                src="1000.png"
                alt="আশিকুর রহমান"
                class="profile-image"
            >

        </div>

        <div class="profile-name">
            আশিকুর রহমান
        </div>

    </div>


    <!-- MESSAGE HEADER -->

    <div class="message-head">

        <div class="message-icon">

            <span>💬</span>

        </div>


        <h1 class="main-title">

            <span>আপনার কথা</span>

            <span>আমার কাছে পৌঁছে দিন</span>

        </h1>


        <div class="title-decoration">

            <div class="title-line"></div>

            <div class="heart">♥</div>
            <div class="title-line"></div>

        </div>


        <div class="header-note">

            বার্তাটি কখন দেখা হবে—তার নির্দিষ্ট সময় নেই!

        </div>

    </div>

</header>


<!-- ================= FORM ================= -->

<main class="form-card">

<form
    id="messageForm"
    enctype="multipart/form-data"
>


<!-- NAME -->

<div class="form-row">

    <div class="form-icon">
        👤
    </div>

    <div>

        <label class="field-label">

            আপনার নাম
            <span class="required">*</span>

        </label>

        <input
            type="text"
            name="name"
            class="input"
            placeholder="আপনার নাম লিখুন"
            required
        >

    </div>

</div>


<!-- CONTACT -->

<div class="form-row">

    <div class="form-icon">
        📞
    </div>

    <div>

        <label class="field-label">

            যোগাযোগ
            <span class="optional">(ঐচ্ছিক)</span>

        </label>

        <input
            type="text"
            name="contact"
            class="input contact-input"
            placeholder="নাম্বার, ই-মেইল অথবা লিংক"
        >

    </div>

</div>


<!-- MESSAGE -->

<div class="form-row">

    <div class="form-icon">
        💬
    </div>

    <div>

        <label class="field-label">

            আপনার মেসেজ
            <span class="required">*</span>

        </label>

        <textarea
            name="message"
            class="message-box"
            placeholder="আপনার কথা এখানে লিখুন..."
            required
        ></textarea>

    </div>

</div>


<!-- FILE -->

<div class="form-row file-row">

    <div class="form-icon">
        📎
    </div>

    <div>

        <label class="field-label">

            ফাইল সংযুক্ত করুন
            <span class="optional">(ঐচ্ছিক)</span>

        </label>


        <div class="file-box">

            <div class="file-title">

                📎 ছবি, PDF বা অন্যান্য ফাইল

            </div>


            <input
                type="file"
                name="attachment"
                id="attachment"
                class="file-input"
            >


            <div class="file-info">

                সর্বোচ্চ ২০ MB • একবারে ১টি ফাইল

            </div>

        </div>

    </div>

</div>


<!-- SUBMIT BUTTON -->

<button
    type="submit"
    class="submit-btn"
>

    <span class="send-arrow">➤</span>

    মেসেজ পাঠান

</button>


<!-- SECURITY -->

<div class="security">

    🛡️ আপনার মেসেজ নিরাপদে সংরক্ষিত হবে এবং গোপনীয় রাখা হবে।

</div>

</form>

</main>


<!-- FOOTER -->

<footer class="footer">

    🔐 আপনার গোপনীয়তা আমাদের কাছে গুরুত্বপূর্ণ ❤️

</footer>


</div>

</div>


<script>

/* ==========================================
   FILE SIZE LIMIT — 20 MB
========================================== */

const fileInput =
    document.getElementById("attachment");


fileInput.addEventListener(
    "change",
    function(){

        if(!this.files.length){
            return;
        }

        const file =
            this.files[0];

        const maxSize =
            20 * 1024 * 1024;


        if(file.size > maxSize){

            alert(
                "ফাইলের আকার ২০ MB-এর বেশি হতে পারবে না।"
            );

            this.value = "";

        }

    }
);


/* ==========================================
   FORM BUTTON TEST
========================================== */

const form =
    document.getElementById("messageForm");


form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        alert(
            "মেসেজ পাঠানোর backend এখনো সংযুক্ত করা হয়নি।"
        );

    }
);

</script>

</body>
</html>
